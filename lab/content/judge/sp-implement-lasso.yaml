problem: sp-implement-lasso
timeout_seconds: 45
starter: |
  import numpy as np

  def soft_threshold(x, t):
      """Elementwise soft thresholding: sign(x) * max(|x| - t, 0)."""
      raise NotImplementedError

  def ista(X, y, lam, steps=500):
      """Minimise 0.5*||Xw - y||^2 + lam*||w||_1 by proximal gradient descent.

      Use step size 1/L with L the largest eigenvalue of X^T X. Start from zero
      and return the final w.
      """
      raise NotImplementedError
tests:
  - name: soft thresholding values
    code: |
      import numpy as np
      out = np.asarray(soft_threshold(np.array([-3.0, -0.5, 0.0, 0.5, 3.0]), 1.0))
      assert np.allclose(out, [-2.0, 0.0, 0.0, 0.0, 2.0]), f"got {out}"
  - name: thresholding at zero is the identity
    code: |
      import numpy as np
      x = np.array([-2.0, 0.3, 4.0])
      assert np.allclose(np.asarray(soft_threshold(x, 0.0)), x)
  - name: a large lambda drives the solution to zero
    code: |
      import numpy as np
      rng = np.random.default_rng(0)
      X = rng.standard_normal((30, 10)); y = rng.standard_normal(30)
      w = np.asarray(ista(X, y, 1e4, steps=200)).ravel()
      assert np.allclose(w, 0.0, atol=1e-6), f"expected the zero vector, got max |w| = {np.max(np.abs(w))}"
  - name: recovers a sparse signal
    code: |
      import numpy as np
      rng = np.random.default_rng(1)
      n, d = 120, 40
      X = rng.standard_normal((n, d)) / np.sqrt(n)
      w_true = np.zeros(d); w_true[[2, 7, 19]] = [3.0, -2.0, 1.5]
      y = X @ w_true
      w = np.asarray(ista(X, y, 0.005, steps=4000)).ravel()
      err = np.linalg.norm(w - w_true) / np.linalg.norm(w_true)
      assert err < 0.2, f"relative error {err} is too large — check the step size and the prox"
  - name: the solution is sparse
    code: |
      import numpy as np
      rng = np.random.default_rng(2)
      n, d = 120, 40
      X = rng.standard_normal((n, d)) / np.sqrt(n)
      w_true = np.zeros(d); w_true[[1, 5]] = [2.0, -3.0]
      y = X @ w_true
      w = np.asarray(ista(X, y, 0.02, steps=3000)).ravel()
      nnz = int(np.sum(np.abs(w) > 1e-6))
      assert nnz <= 12, f"expected a sparse solution, got {nnz} non-zeros"
