problem: jl-implement-projection
timeout_seconds: 40
starter: |
  import numpy as np

  def project(X, k, seed=0):
      """Project rows of X (shape (n, d)) to k dimensions with a Gaussian matrix.

      Use np.random.default_rng(seed) for reproducibility, and scale so that
      squared distances are preserved in expectation.
      """
      raise NotImplementedError
tests:
  - name: output shape
    code: |
      import numpy as np
      X = np.random.default_rng(0).standard_normal((50, 200))
      Y = np.asarray(project(X, 32, seed=1))
      assert Y.shape == (50, 32), f"expected (50, 32), got {Y.shape}"
  - name: reproducible for a fixed seed
    code: |
      import numpy as np
      X = np.random.default_rng(0).standard_normal((10, 60))
      assert np.allclose(project(X, 16, seed=7), project(X, 16, seed=7)), "same seed must give the same projection"
  - name: squared distances are preserved on average
    code: |
      import numpy as np
      rng = np.random.default_rng(2)
      X = rng.standard_normal((60, 150))
      Y = np.asarray(project(X, 64, seed=3))
      i, j = np.triu_indices(60, 1)
      before = ((X[i] - X[j]) ** 2).sum(1)
      after = ((Y[i] - Y[j]) ** 2).sum(1)
      ratio = float(np.mean(after / before))
      assert abs(ratio - 1.0) < 0.05, f"mean squared-distance ratio should be about 1, got {ratio}"
  - name: distortion shrinks as k grows
    code: |
      import numpy as np
      rng = np.random.default_rng(4)
      X = rng.standard_normal((40, 120))
      i, j = np.triu_indices(40, 1)
      before = ((X[i] - X[j]) ** 2).sum(1)
      def worst(k):
          Y = np.asarray(project(X, k, seed=5))
          after = ((Y[i] - Y[j]) ** 2).sum(1)
          return float(np.max(np.abs(after / before - 1.0)))
      assert worst(256) < worst(16), "more target dimensions must reduce worst-case distortion"
