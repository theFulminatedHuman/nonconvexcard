problem: sys-simulate-mm1
timeout_seconds: 90
starter: |
  import numpy as np

  def theoretical_mm1(lam, mu):
      """Closed-form M/M/1 quantities for arrival rate lam and service rate mu.

      Return a dict with keys:
        'rho'        utilisation lam/mu
        'mean_wait'  E[W], time in system
        'mean_queue' E[W_q], time waiting before service starts
        'mean_number' E[N], number in system
      Assume lam < mu.
      """
      raise NotImplementedError

  def simulate_mm1(lam, mu, n_requests=20000, seed=0):
      """Simulate a first-come-first-served M/M/1 queue.

      Draw n_requests exponential inter-arrival times with rate lam and
      exponential service times with rate mu from a generator seeded with
      `seed`. Serve in arrival order on a single server. Return a dict with the
      same four keys, measured from the simulation:

        'rho'         fraction of the simulated horizon the server was busy
        'mean_wait'   mean of (departure - arrival)
        'mean_queue'  mean of (service start - arrival)
        'mean_number' time-average number in system, computed as an integral
                      over the horizon rather than by sampling
        'horizon'     the length of the simulated interval, i.e. the last
                      departure time
        'n'           the number of requests simulated

      Little's law should come out of the simulation rather than being assumed:
      compute 'mean_number' from the occupancy of the system, not as lam times
      'mean_wait'. Done properly, L * horizon equals n * mean_wait exactly —
      that is the area identity, and the tests check it to machine precision.
      """
      raise NotImplementedError
tests:
  - name: the closed forms are the standard M/M/1 results
    code: |
      for lam, mu in ((0.5, 1.0), (0.8, 1.0), (2.0, 5.0)):
          t = theoretical_mm1(lam, mu)
          rho = lam / mu
          assert abs(t['rho'] - rho) < 1e-12, f"rho: expected {rho}, got {t['rho']}"
          assert abs(t['mean_wait'] - 1.0 / (mu - lam)) < 1e-10, \
              f"E[W] should be 1/(mu-lam) = {1/(mu-lam)}, got {t['mean_wait']}"
          assert abs(t['mean_number'] - rho / (1 - rho)) < 1e-10, \
              f"E[N] should be rho/(1-rho) = {rho/(1-rho)}, got {t['mean_number']}"
          assert abs(t['mean_queue'] - (t['mean_wait'] - 1.0 / mu)) < 1e-10, \
              "E[W_q] must be E[W] minus the mean service time"
  - name: the utilisation wall has the right shape
    code: |
      # E[W]/E[S] must be exactly 1/(1-rho).
      for rho in (0.5, 0.8, 0.9, 0.95, 0.99):
          t = theoretical_mm1(rho, 1.0)
          assert abs(t['mean_wait'] - 1.0 / (1 - rho)) < 1e-9, \
              f"rho={rho}: expected {1/(1-rho)}, got {t['mean_wait']}"
      a = theoretical_mm1(0.9, 1.0)['mean_wait']
      b = theoretical_mm1(0.99, 1.0)['mean_wait']
      assert abs(b / a - 10.0) < 1e-6, f"0.9 -> 0.99 should cost a factor 10, got {b/a}"
  - name: the simulation reproduces the mean latency
    code: |
      for lam, mu, tol in ((0.5, 1.0, 0.08), (0.8, 1.0, 0.20)):
          s = simulate_mm1(lam, mu, n_requests=40000, seed=1)
          t = theoretical_mm1(lam, mu)
          rel = abs(s['mean_wait'] - t['mean_wait']) / t['mean_wait']
          assert rel < tol, f"lam={lam}: simulated {s['mean_wait']}, theory {t['mean_wait']}"
  - name: the simulation reproduces the utilisation
    code: |
      for lam, mu in ((0.3, 1.0), (0.7, 1.0)):
          s = simulate_mm1(lam, mu, n_requests=40000, seed=2)
          assert abs(s['rho'] - lam / mu) < 0.03, f"lam={lam}: measured rho {s['rho']}"
  - name: queueing time is waiting time minus service
    code: |
      s = simulate_mm1(0.8, 1.0, n_requests=20000, seed=3)
      gap = s['mean_wait'] - s['mean_queue']
      assert 0.9 < gap < 1.1, f"the gap should be the mean service time 1.0, got {gap}"
      assert s['mean_queue'] >= 0, "queueing time cannot be negative"
      assert s['mean_wait'] > s['mean_queue'], "time in system exceeds time waiting"
  - name: the occupancy is the area under the sample path
    code: |
      # L * T = sum of times in system = n * mean_wait, exactly. An
      # implementation that sets L = lam * mean_wait using the *nominal* lam
      # rather than the empirical n/T fails this, because the realised arrival
      # rate is not exactly lam.
      for lam, mu in ((0.5, 1.0), (0.85, 1.0)):
          s = simulate_mm1(lam, mu, n_requests=40000, seed=4)
          lhs = s['mean_number'] * s['horizon']
          rhs = s['n'] * s['mean_wait']
          assert abs(lhs - rhs) < 1e-6 * max(abs(rhs), 1.0), \
              f"lam={lam}: L*T = {lhs} but n*W = {rhs}"
  - name: Little's law emerges from the measurements
    code: |
      for lam, mu in ((0.5, 1.0), (0.85, 1.0)):
          s = simulate_mm1(lam, mu, n_requests=40000, seed=4)
          assert abs(s['n'] / s['horizon'] - lam) < 0.05 * lam, \
              f"the empirical arrival rate should be close to lam={lam}"
          lhs = s['mean_number']
          rhs = (s['n'] / s['horizon']) * s['mean_wait']
          assert abs(lhs - rhs) / max(rhs, 1e-9) < 1e-9, \
              f"lam={lam}: L = {lhs} but (n/T)*W = {rhs}"
  - name: an idle system is not a busy one
    code: |
      light = simulate_mm1(0.1, 1.0, n_requests=20000, seed=5)
      heavy = simulate_mm1(0.9, 1.0, n_requests=20000, seed=5)
      assert light['mean_wait'] < heavy['mean_wait'] / 3, \
          f"light load {light['mean_wait']} should be far below heavy {heavy['mean_wait']}"
      assert light['mean_queue'] < 0.3, f"at rho=0.1 there should be almost no queueing, got {light['mean_queue']}"
