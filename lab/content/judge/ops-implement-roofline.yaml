problem: ops-implement-roofline
timeout_seconds: 20
starter: |
  def ridge_point(peak_flops, bandwidth):
      """Arithmetic intensity, in FLOP per byte, where compute and memory bounds meet."""
      raise NotImplementedError

  def decode_floor_seconds(n_params, bytes_per_param, bandwidth):
      """Lower bound on the time to emit one token, from weight traffic alone."""
      raise NotImplementedError

  def kv_bytes_per_token(n_layers, d_kv, bytes_per_elem):
      """Bytes of KV cache per token per sequence."""
      raise NotImplementedError

  def max_batch(total_memory, weight_bytes, overhead_bytes, kv_per_token, seq_len):
      """Largest number of concurrent sequences whose cache fits in what remains."""
      raise NotImplementedError
tests:
  - name: ridge point of an H100-class device
    code: |
      r = ridge_point(9.9e14, 3.35e12)
      assert abs(r - 295.5) < 1.5, f"expected about 295 FLOP/byte, got {r}"
  - name: decode floor for a 7B model in BF16
    code: |
      t = decode_floor_seconds(6.7e9, 2, 3.35e12)
      assert abs(t - 0.004) < 2e-4, f"expected about 4.0 ms, got {t * 1e3} ms"
  - name: halving precision halves the floor
    code: |
      a = decode_floor_seconds(6.7e9, 2, 3.35e12)
      b = decode_floor_seconds(6.7e9, 1, 3.35e12)
      assert abs(a - 2 * b) < 1e-9, "the floor is linear in bytes per parameter"
  - name: KV cache for a 32-layer MHA model
    code: |
      b = kv_bytes_per_token(32, 4096, 2)
      assert b == 524288, f"expected 524288 bytes per token, got {b}"
  - name: batch capacity at 4k context
    code: |
      kv = kv_bytes_per_token(32, 4096, 2)
      n = max_batch(80e9, 13.4e9, 5e9, kv, 4096)
      assert n == 28, f"expected 28 sequences, got {n}"
  - name: capacity is zero when nothing fits
    code: |
      kv = kv_bytes_per_token(80, 8192, 2)
      n = max_batch(80e9, 140e9, 5e9, kv, 4096)
      assert n == 0, f"capacity must not go negative, got {n}"
