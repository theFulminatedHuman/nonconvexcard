defaults:
  field: probability
problems:
  - id: pr-union-bound-tight
    title: When is the union bound tight?
    topic: probability/probability-spaces
    difficulty: foundation
    type: proof
    estimated_time: 15m
    tags: [union bound, tightness, inclusion-exclusion]
    statement: |
      Show that the union bound $\P(\bigcup_iA_i)\le\sum_i\P(A_i)$ holds with equality if and only if
      the $A_i$ are pairwise disjoint up to null sets. Then give an example with $n$ events, each of
      probability $1/n$, where the union bound gives $1$ but the true probability is $1/n$.
    hints:
      - Use the disjointification $B_i = A_i\setminus\bigcup_{j<i}A_j$ from the proof.
      - For the example, make all the events identical.
    solution: |
      **Equality case.** With $B_i = A_i\setminus\bigcup_{j<i}A_j$ the $B_i$ are disjoint with the same
      union, so $\P(\bigcup A_i) = \sum_i\P(B_i)$. Hence
      $$
      \sum_i\P(A_i) - \P\Big(\bigcup_iA_i\Big) = \sum_i\big(\P(A_i)-\P(B_i)\big) = \sum_i\P\Big(A_i\cap\bigcup_{j<i}A_j\Big),
      $$
      a sum of non-negative terms. It vanishes iff every term does, i.e. iff
      $\P(A_i\cap A_j)=0$ for all $i\ne j$.

      **Worst case.** Take $A_1=\dots=A_n=A$ with $\P(A)=1/n$. Then $\bigcup_iA_i = A$ has probability
      $1/n$, while $\sum_i\P(A_i) = 1$. The union bound is off by a factor of $n$.

      The lesson: the union bound ignores all dependence, so it is tight for disjoint events and
      maximally loose for identical ones. Much of high-dimensional probability consists of recovering,
      via chaining or via nets at multiple scales, some of what the union bound discards.

  - id: pr-pairwise-not-independent
    title: Pairwise independence does not imply independence
    topic: probability/probability-spaces
    difficulty: foundation
    type: proof
    estimated_time: 15m
    tags: [independence, counterexample]
    statement: |
      Let $X_1,X_2$ be independent uniform signs on $\{-1,+1\}$ and $X_3 = X_1X_2$. Show that
      $X_1,X_2,X_3$ are pairwise independent but not independent. Then show that Chebyshev's bound on
      $\Var(X_1+X_2+X_3)$ still applies, while the Chernoff argument does not.
    hints:
      - Compute $\P(X_i=1, X_j=1)$ for each pair, and then $\P(X_1=X_2=X_3=1)$.
      - Which step of the Chernoff method needs full independence?
    solution: |
      **Pairwise.** $X_3$ is a uniform sign: $\P(X_3=1) = \P(X_1=X_2) = 1/2$. For the pair
      $(X_1,X_3)$: $\P(X_1=1,X_3=1) = \P(X_1=1,X_2=1) = 1/4 = \P(X_1=1)\P(X_3=1)$, and similarly for
      the other three sign combinations and for the pair $(X_2,X_3)$. So all three pairs are
      independent.

      **Not independent.** $\P(X_1=1,X_2=1,X_3=1) = \P(X_1=1,X_2=1) = 1/4$, whereas the product of the
      marginals is $1/8$. Indeed $X_3$ is a deterministic function of $(X_1,X_2)$.

      **Chebyshev still works.** Variance of a sum needs only that the covariances vanish:
      $\Cov(X_i,X_j) = \E[X_iX_j] - \E X_i\E X_j = 0$ for each pair by pairwise independence. So
      $\Var(X_1+X_2+X_3) = 3$ and Chebyshev gives $\P(|S|\ge t)\le3/t^2$.

      **Chernoff fails.** The Chernoff method factorises the moment generating function,
      $\E e^{\lambda(X_1+X_2+X_3)} = \prod_i\E e^{\lambda X_i}$, and that step requires the joint
      distribution to be the product of the marginals — full independence, not pairwise. Here,
      direct computation gives $\E e^{\lambda S} = \frac12(e^{3\lambda}+3e^{-\lambda})$, whereas the
      product of the marginals would give $\cosh^3\lambda$; these differ.

  - id: pr-borel-cantelli-application
    title: From an exponential tail bound to almost sure convergence
    topic: probability/probability-spaces
    difficulty: intermediate
    type: proof
    estimated_time: 30m
    tags: [borel cantelli, almost sure, concentration]
    statement: |
      Let $X_1,X_2,\dots$ be i.i.d. with $X_i\in[0,1]$ and mean $\mu$, and let $\bar X_n$ be the sample
      mean. Using Hoeffding's inequality and Borel–Cantelli, prove that
      $$
      \bar X_n \to \mu \quad\text{almost surely},
      $$
      and moreover that $|\bar X_n - \mu| \le \sqrt{\frac{2\log n}{n}}$ for all sufficiently large $n$,
      almost surely.
    hints:
      - Hoeffding gives $\P(|\bar X_n - \mu| \ge t) \le 2e^{-2nt^2}$ for each fixed $n$.
      - Choose $t = t_n$ so that the resulting probabilities are summable, then apply the first Borel–Cantelli lemma.
      - For the first claim, fix $\eps>0$ and note that $\sum_n e^{-2n\eps^2}<\infty$.
    solution: |
      **Almost sure convergence.** Fix $\eps>0$ and let $A_n = \{|\bar X_n - \mu|\ge\eps\}$. Hoeffding
      gives $\P(A_n)\le2e^{-2n\eps^2}$, and
      $$
      \sum_{n\ge1}\P(A_n) \le 2\sum_{n\ge1}e^{-2n\eps^2} = \frac{2e^{-2\eps^2}}{1-e^{-2\eps^2}} < \infty .
      $$
      By the first Borel–Cantelli lemma, $\P(A_n\text{ i.o.}) = 0$: almost surely only finitely many
      $A_n$ occur, so $\limsup_n|\bar X_n-\mu| \le \eps$ almost surely. Intersecting over a countable
      sequence $\eps = 1/k\downarrow0$ — an intersection of probability-one events — gives
      $\bar X_n\to\mu$ almost surely.

      **The explicit rate.** Take $t_n = \sqrt{2\log n/n}$ and $B_n = \{|\bar X_n-\mu|\ge t_n\}$. Then
      $$
      \P(B_n) \le 2\exp\big(-2n\cdot\tfrac{2\log n}{n}\big) = 2e^{-4\log n} = \frac{2}{n^4},
      $$
      which is summable. Borel–Cantelli again gives $\P(B_n\text{ i.o.})=0$, so almost surely there is
      a (random) $N$ with $|\bar X_n-\mu| < \sqrt{2\log n/n}$ for all $n\ge N$.

      This is the standard route from a **quantitative** concentration bound to a **qualitative**
      almost-sure statement, and it also produces a rate, which the classical strong law does not.

  - id: ex-tail-formula-moments
    title: Moments from tail bounds via the layer-cake formula
    topic: probability/expectation-and-conditioning
    difficulty: intermediate
    type: proof
    estimated_time: 30m
    tags: [tail formula, moments, sub-gaussian]
    statement: |
      Suppose $X\ge0$ satisfies $\P(X\ge t)\le 2e^{-t^2/K^2}$ for all $t\ge0$. Using the tail formula
      $\E[X^p] = p\int_0^\infty t^{p-1}\P(X>t)\,dt$, prove that
      $$
      \E[X^p]^{1/p} \le CK\sqrt p
      $$
      for an absolute constant $C$ and all $p \ge 1$. Compute $\E X$ and $\E X^2$ explicitly in terms
      of $K$.
    hints:
      - Substitute $u = t^2/K^2$ to turn the integral into a Gamma function.
      - Use $\Gamma(p/2)^{1/p} \le C\sqrt p$, which follows from Stirling.
    solution: |
      By the tail formula and the hypothesis,
      $$
      \E[X^p] = p\int_0^\infty t^{p-1}\P(X>t)\,dt \le 2p\int_0^\infty t^{p-1}e^{-t^2/K^2}\,dt .
      $$
      Substitute $u = t^2/K^2$, so $t = K\sqrt u$ and $dt = \frac{K}{2\sqrt u}du$:
      $$
      \int_0^\infty t^{p-1}e^{-t^2/K^2}dt = \int_0^\infty K^{p-1}u^{(p-1)/2}e^{-u}\frac{K}{2\sqrt u}du
      = \frac{K^p}{2}\int_0^\infty u^{p/2-1}e^{-u}du = \frac{K^p}{2}\Gamma\!\Big(\frac p2\Big).
      $$
      Hence $\E[X^p] \le pK^p\Gamma(p/2)$, and
      $$
      \E[X^p]^{1/p} \le K\,p^{1/p}\,\Gamma(p/2)^{1/p} .
      $$
      Now $p^{1/p}\le e^{1/e}\le1.45$ for all $p\ge1$, and Stirling gives
      $\Gamma(p/2)^{1/p} = \big((p/2)!\big)^{1/p}\cdot(1+o(1)) \le C'\sqrt p$. Combining,
      $\E[X^p]^{1/p}\le CK\sqrt p$.

      **Explicit low moments.** With $p=1$: $\E X \le 2\int_0^\infty e^{-t^2/K^2}dt = K\sqrt\pi$.
      With $p=2$: $\E X^2 \le 4\int_0^\infty te^{-t^2/K^2}dt = 2K^2$.

      This is the moment characterisation of sub-Gaussianity: a Gaussian-type tail is exactly
      equivalent to $\sqrt p$ growth of the $L^p$ norms.

  - id: ex-total-variance
    title: Law of total variance and its use
    topic: probability/expectation-and-conditioning
    difficulty: intermediate
    type: proof
    estimated_time: 30m
    tags: [total variance, conditional expectation, decomposition]
    statement: |
      Prove the law of total variance
      $$
      \Var(X) = \E\big[\Var(X\mid\mathcal G)\big] + \Var\big(\E[X\mid\mathcal G]\big),
      $$
      and use it to compute the variance of $X$ when $N\sim\text{Poisson}(\lambda)$ and, given $N$,
      $X$ is the sum of $N$ i.i.d. variables with mean $m$ and variance $s^2$.
    hints:
      - Write $\Var(X\mid\mathcal G) = \E[X^2\mid\mathcal G] - (\E[X\mid\mathcal G])^2$ and take expectations of both sides.
      - For the application, condition on $N$.
    solution: |
      **Proof.** Let $M = \E[X\mid\mathcal G]$. By definition
      $\Var(X\mid\mathcal G) = \E[X^2\mid\mathcal G] - M^2$, so by the tower property
      $$
      \E\big[\Var(X\mid\mathcal G)\big] = \E[X^2] - \E[M^2].
      $$
      Also $\E M = \E X$ by the tower property, so
      $$
      \Var(M) = \E[M^2] - (\E X)^2 .
      $$
      Adding the two displays, the $\E[M^2]$ terms cancel and the total is
      $\E[X^2]-(\E X)^2 = \Var(X)$.

      **Compound Poisson.** Condition on $N$. Given $N=n$, $X$ is a sum of $n$ i.i.d. terms, so
      $$
      \E[X\mid N] = Nm, \qquad \Var(X\mid N) = Ns^2 .
      $$
      Therefore
      $$
      \Var(X) = \E[Ns^2] + \Var(Nm) = \lambda s^2 + m^2\lambda = \lambda(s^2+m^2),
      $$
      using $\E N = \Var(N) = \lambda$ for a Poisson.

      The decomposition separates two sources of variability: the randomness *within* each group
      ($\E[\Var(X\mid\mathcal G)]$) and the randomness *between* groups
      ($\Var(\E[X\mid\mathcal G])$) — which is exactly the ANOVA decomposition.

  - id: ex-conditional-projection
    title: Conditional expectation minimises mean squared error
    topic: probability/expectation-and-conditioning
    difficulty: intermediate
    type: proof
    estimated_time: 30m
    tags: [conditional expectation, projection, bayes predictor]
    statement: |
      Let $X, Y$ be square-integrable. Prove that
      $$
      \E\big[(Y - g(X))^2\big] \ \ge\ \E\big[(Y - \E[Y\mid X])^2\big]
      $$
      for every measurable $g$ with $\E[g(X)^2]<\infty$, with equality iff $g(X)=\E[Y\mid X]$ almost
      surely. Conclude that the Bayes-optimal predictor for squared loss is the regression function.
    hints:
      - Insert and subtract $\E[Y\mid X]$ inside the square and expand.
      - Show the cross term vanishes using the tower property and the fact that $\E[Y\mid X]-g(X)$ is a function of $X$.
    solution: |
      Write $m(X) = \E[Y\mid X]$ and decompose
      $$
      Y - g(X) = \big(Y - m(X)\big) + \big(m(X)-g(X)\big).
      $$
      Squaring and taking expectations,
      $$
      \E\big[(Y-g(X))^2\big] = \E\big[(Y-m(X))^2\big] + 2\E\big[(Y-m(X))(m(X)-g(X))\big] + \E\big[(m(X)-g(X))^2\big].
      $$
      The cross term vanishes: $m(X)-g(X)$ is $\sigma(X)$-measurable, so by "taking out what is known"
      and the tower property,
      $$
      \E\big[(Y-m(X))(m(X)-g(X))\big] = \E\Big[(m(X)-g(X))\,\underbrace{\E[Y-m(X)\mid X]}_{=0}\Big] = 0 .
      $$
      Hence
      $$
      \E\big[(Y-g(X))^2\big] = \E\big[(Y-m(X))^2\big] + \E\big[(m(X)-g(X))^2\big] \ \ge\ \E\big[(Y-m(X))^2\big],
      $$
      with equality iff $\E[(m(X)-g(X))^2] = 0$, i.e. $g(X) = m(X)$ almost surely.

      **Interpretation.** The identity is the Pythagorean theorem in $L^2$: $Y - m(X)$ is orthogonal to
      every square-integrable function of $X$, so $m(X)$ is the orthogonal projection of $Y$ onto
      $L^2(\sigma(X))$. The irreducible term $\E[(Y-m(X))^2] = \E[\Var(Y\mid X)]$ is the noise floor —
      no predictor beats it. Every regression method in this laboratory is an attempt to estimate $m$
      from a finite sample.

  - id: ex-correlated-average
    title: The 1/n variance rate requires uncorrelated samples
    topic: probability/expectation-and-conditioning
    difficulty: intermediate
    type: numerical
    estimated_time: 30m
    tags: [variance, correlation, effective sample size]
    statement: |
      Let $X_1,\dots,X_n$ have common variance $\sigma^2$ and equicorrelation
      $\Cov(X_i,X_j) = \rho\sigma^2$ for $i\ne j$, with $\rho \in [0,1]$.

      1. Compute $\Var(\bar X_n)$ exactly.
      2. Find the limit as $n\to\infty$ and interpret it.
      3. Define the **effective sample size** $n_{\text{eff}} = \sigma^2/\Var(\bar X_n)$ and compute it
         for $\rho = 0.1$ with $n = 10^6$.
    hints:
      - Expand $\Var(\frac1n\sum_iX_i)$ into $n$ variance terms and $n(n-1)$ covariance terms.
      - Notice which term survives as $n\to\infty$.
    solution: |
      **1.**
      $$
      \Var(\bar X_n) = \frac{1}{n^2}\Big[n\sigma^2 + n(n-1)\rho\sigma^2\Big]
      = \frac{\sigma^2}{n}\Big[1 + (n-1)\rho\Big]
      = \sigma^2\Big(\frac{1-\rho}{n} + \rho\Big).
      $$

      **2.** As $n\to\infty$ this tends to $\rho\sigma^2$, **not** to zero. With any positive
      correlation, averaging more samples does not drive the variance to zero: there is a floor
      $\rho\sigma^2$ that no amount of data removes. Only at $\rho=0$ is the classical $\sigma^2/n$
      rate recovered.

      **3.**
      $$
      n_{\text{eff}} = \frac{\sigma^2}{\Var(\bar X_n)} = \frac{n}{1+(n-1)\rho} .
      $$
      At $\rho = 0.1$ and $n = 10^6$, $n_{\text{eff}} \approx 1/\rho = 10$. A million correlated
      samples carry the information of about ten independent ones.

      This is why "we have a billion tokens" is not the same as "we have a billion independent
      observations": adjacent tokens in a document are strongly dependent, and the effective sample
      size is governed by the correlation structure, not the raw count.

  - id: mc-modes-counterexample
    title: Separating the four modes of convergence
    topic: probability/modes-of-convergence
    difficulty: intermediate
    type: proof
    estimated_time: 30m
    tags: [convergence, counterexample]
    statement: |
      Construct random variables demonstrating each of the following, and prove your constructions work.

      1. $X_n\xrightarrow{\P}0$ but not almost surely.
      2. $X_n\to0$ almost surely but not in $L^1$.
      3. $X_n\rightsquigarrow X$ but $X_n$ does not converge to $X$ in probability.
    hints:
      - For (1), use a sliding window on $[0,1]$ whose widths are summable in probability but whose total length diverges.
      - For (2), make the variable large on a small set.
      - For (3), remember convergence in distribution is a statement about laws only.
    solution: |
      **1. In probability, not almost surely.** Let $U\sim\text{Unif}[0,1]$. For $n = 2^k+j$ with
      $0\le j<2^k$, set $X_n = \one\{U \in [j2^{-k},(j+1)2^{-k}]\}$. Then
      $\P(X_n\ne0) = 2^{-k}\to0$, so $X_n\xrightarrow{\P}0$. But for each fixed $k$ the $2^k$ intervals
      cover $[0,1]$, so for every $U$ and every $k$ there is some $n$ in that block with $X_n = 1$.
      Hence $X_n = 1$ infinitely often for every $U$, and $X_n$ does not converge to $0$ at any point.

      **2. Almost surely, not in $L^1$.** With the same $U$, set $X_n = n\,\one\{U<1/n\}$. For any fixed
      $U>0$, once $n>1/U$ we have $X_n = 0$, so $X_n\to0$ almost surely (the exceptional set $\{U=0\}$
      is null). But $\E X_n = n\cdot\frac1n = 1$ for every $n$, so $X_n\not\to0$ in $L^1$. This also
      shows almost-sure convergence does not imply $L^p$ convergence without a domination hypothesis.

      **3. In distribution, not in probability.** Let $Z\sim\Ncal(0,1)$ and $X_n = (-1)^nZ$. Since $Z$
      is symmetric, every $X_n$ has the standard normal law, so $X_n\rightsquigarrow Z$ trivially. But
      $|X_n - Z| = 2|Z|$ for odd $n$, so $\P(|X_n-Z|>1)$ does not tend to $0$: there is no convergence
      in probability to $Z$. Convergence in distribution constrains only the marginal laws, never the
      joint behaviour.

  - id: mc-wlln-uncorrelated
    title: The weak law needs only uncorrelatedness
    topic: probability/modes-of-convergence
    difficulty: beginner
    type: proof
    estimated_time: 15m
    tags: [lln, chebyshev, uncorrelated]
    statement: |
      Prove that if $X_1,X_2,\dots$ are **uncorrelated** with common mean $\mu$ and variance at most
      $\sigma^2$, then $\bar X_n\xrightarrow{\P}\mu$, with the explicit bound
      $\P(|\bar X_n-\mu|\ge t) \le \sigma^2/(nt^2)$. Then give an example of uncorrelated but dependent
      variables to show the hypothesis is genuinely weaker than independence.
    hints:
      - Uncorrelatedness is exactly what makes the variance of a sum equal the sum of the variances.
      - For the example, reuse the construction with $X_3 = X_1X_2$.
    solution: |
      **Proof.** $\E\bar X_n = \mu$ by linearity. Since the covariances vanish,
      $$
      \Var(\bar X_n) = \frac{1}{n^2}\sum_{i=1}^n\Var(X_i) \le \frac{\sigma^2}{n}.
      $$
      Chebyshev's inequality gives
      $$
      \P\big(|\bar X_n - \mu|\ge t\big) \le \frac{\Var(\bar X_n)}{t^2} \le \frac{\sigma^2}{nt^2} \xrightarrow[n\to\infty]{}0 ,
      $$
      which is convergence in probability.

      **Uncorrelated but dependent.** Let $X_1,X_2$ be independent uniform signs and $X_3 = X_1X_2$.
      Each pair is uncorrelated ($\E[X_iX_j] = 0 = \E X_i\E X_j$), but $X_3$ is determined by
      $(X_1,X_2)$, so they are far from independent. The weak law above applies to any sequence built
      from such triples; the exponential bounds of the concentration page do not.

      Note the rate: $1/(nt^2)$ is **polynomial** in the failure probability. Under boundedness and
      full independence, Hoeffding improves this to $2e^{-2nt^2}$, exponentially better — which is why
      the extra hypotheses are worth having.

  - id: mc-clt-vs-hoeffding
    title: Why the CLT cannot be used for tail bounds
    topic: probability/modes-of-convergence
    difficulty: advanced
    type: numerical
    estimated_time: 30m
    tags: [clt, berry-esseen, hoeffding, tails]
    statement: |
      Let $X_1,\dots,X_n$ be i.i.d. uniform on $\{0,1\}$, $n = 100$, and consider
      $\P(\bar X_n \ge 0.7)$.

      1. Compute the exact value from the binomial distribution.
      2. Compute the CLT approximation.
      3. Compute Hoeffding's upper bound.
      4. Compute the Berry–Esseen error bound and compare it to the quantity being estimated.
      5. State precisely which of (2) and (3) is a valid bound, and why.
    hints:
      - The Berry–Esseen constant may be taken as $C = 0.5$, and $\rho = \E|X_1-\mu|^3$.
      - Compare the magnitude of the Berry–Esseen error with the probability itself.
    solution: |
      With $\mu = 0.5$, $\sigma^2 = 0.25$, $\sigma = 0.5$, $\rho = \E|X_1-0.5|^3 = 0.125$.

      **1. Exact.** $\P(\bar X_{100}\ge0.7) = \P(\text{Bin}(100,0.5)\ge70) \approx 3.9\times10^{-5}$.

      **2. CLT.** $\P(\bar X\ge0.7)\approx 1-\Phi\big(\frac{0.2\sqrt{100}}{0.5}\big) = 1-\Phi(4) \approx 3.2\times10^{-5}$.
      Close to the truth — but see (4).

      **3. Hoeffding.** $\P(\bar X - \mu\ge t)\le e^{-2nt^2} = e^{-2\cdot100\cdot0.04} = e^{-8}\approx3.4\times10^{-4}$.
      About $9\times$ larger than the truth, and a **valid upper bound**.

      **4. Berry–Esseen.** The error of the CLT approximation is bounded by
      $$
      \frac{C\rho}{\sigma^3\sqrt n} = \frac{0.5\times0.125}{0.125\times10} = 0.05 .
      $$
      So the guaranteed accuracy of the CLT approximation is $\pm0.05$ — which is **more than a
      thousand times larger** than the probability being estimated ($3.9\times10^{-5}$). The CLT
      approximation is consistent with the true value being anywhere in $[0, 0.05]$.

      **5. Which is valid.** Hoeffding is a theorem: the true probability is *at most* $3.4\times10^{-4}$,
      for this and every $n$. The CLT gives an *approximation with no usable error control in this
      regime*. That the CLT number happens to be close here is luck, not a guarantee, and there is no
      way to know it from the CLT alone.

      This is the concrete form of the argument on the modes-of-convergence page: any statement of the
      form "with probability at least $1-\delta$" for small $\delta$ needs a non-asymptotic bound, not
      an asymptotic approximation.
