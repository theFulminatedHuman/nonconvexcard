{ id:"db3", t:"Transactions, ACID and Isolation", freq:3,
  lead:"ACID is asked verbatim. Isolation levels and the anomalies they permit follow.",
  theory:`
<h2>The unit of work</h2>
<p>A transaction is a sequence of operations the database must treat as <b>one indivisible
step</b>. The canonical example is a transfer: debit A, credit B. Between those two writes the
money exists nowhere, and no other transaction may observe that state, nor may a crash leave
it permanent.</p>
<p>A transaction moves through states: <i>active</i> → <i>partially committed</i> (last
statement done) → <i>committed</i> (changes durable), or → <i>failed</i> → <i>aborted</i>
(rolled back). <b>COMMIT</b> makes everything permanent; <b>ROLLBACK</b> undoes everything.</p>

<h2>ACID, and the mechanism behind each letter</h2>
<div class="tbl"><table>
<tr><th>Property</th><th>Guarantee</th><th>How it is implemented</th></tr>
<tr><td><b>Atomicity</b></td><td>All operations happen, or none do</td><td>An <b>undo log</b> records old values so a failed transaction can be reversed</td></tr>
<tr><td><b>Consistency</b></td><td>The database moves from one valid state to another; all constraints hold</td><td>Constraint checking, plus correct application logic — this one is shared with the programmer</td></tr>
<tr><td><b>Isolation</b></td><td>Concurrent transactions do not see each other's partial work</td><td>Locking (2PL) or multi-version concurrency control</td></tr>
<tr><td><b>Durability</b></td><td>Once committed, changes survive a crash</td><td><b>Write-ahead logging</b>: the log is forced to disk <i>before</i> the commit is acknowledged</td></tr>
</table></div>
<p>Write-ahead logging is worth understanding properly: writing the data pages themselves at
commit time would be slow and scattered, so instead the <b>log record</b> — a small sequential
write — is flushed, and the pages follow lazily. After a crash, recovery replays the log
(<b>redo</b>) for committed transactions and reverses it (<b>undo</b>) for uncommitted ones.
Durability is therefore bought with one sequential disk write, not many random ones.</p>

<h2>Why concurrency is allowed at all</h2>
<p>Running transactions one at a time would make isolation trivial and throughput terrible —
while one transaction waits on disk, the CPU idles. So they interleave, and the database's job
is to allow only interleavings <b>equivalent to some serial order</b>.</p>
<p>That property is <b>serializability</b>. The practical test is <b>conflict
serializability</b>: two operations conflict if they are from different transactions, on the
same item, and at least one is a write. Build a <b>precedence graph</b> with a node per
transaction and an edge Ti → Tj whenever an operation of Ti must precede a conflicting one of
Tj. The schedule is conflict-serializable exactly when that graph is <b>acyclic</b>, and a
topological sort gives the equivalent serial order.</p>

<h2>The four anomalies</h2>
<ol>
<li><b>Dirty read</b> — T2 reads a value T1 wrote but has not committed. If T1 rolls back, T2
acted on data that never existed.</li>
<li><b>Non-repeatable read</b> — T2 reads a row twice and gets different values, because T1
updated and committed in between.</li>
<li><b>Phantom read</b> — T2 runs the same <i>range</i> query twice and the second returns
extra rows, because T1 inserted rows matching the condition. Note the difference from a
non-repeatable read: that is about a row changing, this is about rows appearing. Preventing it
needs <b>range locks</b>, not row locks.</li>
<li><b>Lost update</b> — two transactions read the same value, both compute a new one, and the
second write silently overwrites the first.</li>
</ol>

<h2>Isolation levels: buying safety with concurrency</h2>
<p>Full serializability is expensive, so SQL defines weaker levels. Each removes one more
anomaly and permits less concurrency:</p>
<div class="tbl"><table>
<tr><th>Level</th><th>Dirty read</th><th>Non-repeatable read</th><th>Phantom read</th></tr>
<tr><td>Read uncommitted</td><td>Possible</td><td>Possible</td><td>Possible</td></tr>
<tr><td>Read committed</td><td><b>No</b></td><td>Possible</td><td>Possible</td></tr>
<tr><td>Repeatable read</td><td><b>No</b></td><td><b>No</b></td><td>Possible</td></tr>
<tr><td>Serializable</td><td><b>No</b></td><td><b>No</b></td><td><b>No</b></td></tr>
</table></div>
<p>Read committed is the common default (PostgreSQL, Oracle, SQL Server); MySQL's InnoDB
defaults to repeatable read. The table is the single most-asked thing in this topic —
memorise the staircase shape.</p>

<h2>How isolation is enforced</h2>
<h4>Two-phase locking</h4>
<p>Every transaction has a <b>growing phase</b> in which it may acquire locks but release
none, and a <b>shrinking phase</b> in which it may release but not acquire. That discipline
alone guarantees conflict-serializability.</p>
<p>It does not prevent <b>cascading rollback</b>: if T1 releases a lock, T2 reads the value,
and T1 then aborts, T2 must abort too. <b>Strict 2PL</b> — hold all exclusive locks until
commit — fixes this, and is what real systems implement. Locks come in <b>shared</b> (read,
compatible with other shared) and <b>exclusive</b> (write, compatible with nothing) modes.</p>
<h4>Deadlock, again</h4>
<p>2PL makes deadlock possible: T1 holds X and wants Y, T2 holds Y and wants X. Databases do
not prevent it, they <b>detect</b> it with a wait-for graph and abort a victim — usually the
transaction that has done least work. Applications must therefore be prepared for a
transaction to fail and be retried; that is a normal condition, not a bug.</p>
<h4>MVCC — the alternative</h4>
<p>Instead of blocking readers, keep <b>multiple versions</b> of each row. A reader sees a
consistent snapshot as of its start time, while a writer creates a new version. The
consequence is the property most production systems are built around: <b>readers never block
writers and writers never block readers</b>. Conflicts between two writers still have to be
resolved, and old versions must be garbage-collected. PostgreSQL, Oracle and InnoDB all use
it.</p>`,
  notes:`
<h3>ACID</h3>
<ul>
<li><b>Atomicity</b> — all operations happen or none do. Enforced by the transaction manager with undo logs.</li>
<li><b>Consistency</b> — the database moves from one valid state to another; all constraints hold.</li>
<li><b>Isolation</b> — concurrent transactions do not see each other's intermediate state.</li>
<li><b>Durability</b> — once committed, survives crashes. Enforced by write-ahead logging.</li>
</ul>
<h3>Concurrency anomalies</h3>
<div class="tbl"><table>
<tr><th>Anomaly</th><th>What happens</th></tr>
<tr><td><b>Dirty read</b></td><td>Reads data written by an uncommitted transaction that later rolls back</td></tr>
<tr><td><b>Non-repeatable read</b></td><td>Reads the same row twice and gets different values (someone updated it)</td></tr>
<tr><td><b>Phantom read</b></td><td>Re-runs a range query and sees new rows (someone inserted)</td></tr>
<tr><td><b>Lost update</b></td><td>Two transactions write the same row; one overwrite is lost</td></tr>
</table></div>
<h3>Isolation levels</h3>
<div class="tbl"><table>
<tr><th>Level</th><th>Dirty</th><th>Non-repeatable</th><th>Phantom</th></tr>
<tr><td>Read Uncommitted</td><td>✓ possible</td><td>✓</td><td>✓</td></tr>
<tr><td>Read Committed</td><td>✗</td><td>✓</td><td>✓</td></tr>
<tr><td>Repeatable Read</td><td>✗</td><td>✗</td><td>✓</td></tr>
<tr><td>Serializable</td><td>✗</td><td>✗</td><td>✗</td></tr>
</table></div>
<p>Higher isolation ⇒ fewer anomalies, more locking, less concurrency.</p>
<h3>Concurrency control</h3>
<ul>
<li><b>Two-phase locking (2PL)</b> — a growing phase acquires locks, a shrinking phase releases them. Guarantees serializability; can deadlock.</li>
<li><b>Strict 2PL</b> — holds all locks until commit. Avoids cascading rollback.</li>
<li><b>Shared lock</b> (read, many allowed) vs <b>Exclusive lock</b> (write, one only).</li>
<li><b>MVCC</b> — readers see a snapshot and never block writers. Used by PostgreSQL and MySQL/InnoDB.</li>
</ul>
<h3>Transaction states</h3>
<p><code>Active → Partially committed → Committed</code>, or <code>Active → Failed → Aborted</code>.</p>`,
  mcqs:[
  {q:"Which ACID property guarantees that a transaction's effects survive a system crash?",o:["Atomicity","Consistency","Isolation","Durability"],a:3,
   w:"<b>Durability</b> — once committed, the changes persist, typically ensured by a write-ahead log flushed to stable storage."},
  {q:"A dirty read occurs when a transaction reads data that",o:["Has been deleted","Was written by an uncommitted transaction","Is locked","Is in a different table"],a:1,
   w:"A <b>dirty read</b> exposes an uncommitted value, which becomes invalid if that transaction rolls back."},
  {q:"Which isolation level prevents dirty reads but still allows non-repeatable reads?",o:["Read Uncommitted","Read Committed","Repeatable Read","Serializable"],a:1,
   w:"<b>Read Committed</b> only reads committed data, but a row can change between two reads in the same transaction."},
  {q:"Phantom reads are prevented only at which isolation level?",o:["Read Committed","Repeatable Read","Serializable","Read Uncommitted"],a:2,
   w:"<b>Serializable</b> is the only standard level that prevents phantoms, since it must also prevent newly inserted rows appearing in a repeated range query."},
  {q:"Two-phase locking guarantees",o:["Freedom from deadlock","Conflict serializability","Maximum concurrency","Durability"],a:1,
   w:"<b>2PL</b> guarantees conflict serializability but does <i>not</i> prevent deadlock — that still needs detection or prevention."},
  {q:"In MVCC, readers",o:["Block writers","Are blocked by writers","Read a consistent snapshot without blocking","Must take exclusive locks"],a:2,
   w:"<b>Multiversion concurrency control</b> keeps old row versions so a reader sees a consistent snapshot and neither blocks nor is blocked by writers."},
  {q:"Atomicity is enforced primarily by",o:["Indexes","The log and rollback mechanism","Normalization","Foreign keys"],a:1,
   w:"Undo information in the <b>transaction log</b> lets an incomplete transaction be rolled back entirely, giving all-or-nothing behaviour."}]},

{ id:"db4", t:"Indexing", freq:2,
  lead:"Clustered vs non-clustered is the question that actually gets asked.",
  theory:`
<h2>Why an index exists</h2>
<p><code>WHERE email = 'x'</code> with no index means reading every row — a <b>full table
scan</b>, O(n) disk I/O. An index is a separate, ordered structure mapping column values to
row locations, so the same query becomes a lookup in O(log n). On a million-row table that is
the difference between hundreds of thousands of page reads and three or four.</p>
<p>The units here are disk pages, not comparisons. A page read is milliseconds on a spinning
disk and tens of microseconds on SSD, while a comparison in memory is nanoseconds — so the
only thing that matters when designing an index structure is <b>how many pages must be
fetched</b>.</p>

<h2>Why B+ trees and not binary trees</h2>
<p>A balanced binary tree over a million keys has height about 20, so a lookup costs about 20
page reads. A <b>B+ tree</b> makes each node the size of a disk page and stores hundreds of
keys in it, so the branching factor is in the hundreds rather than 2, and the height collapses:</p>
<ul>
<li>Fanout 100, one million rows → height <b>3</b>. Ten million rows → height 4.</li>
<li>The upper levels stay cached in memory, so a lookup often costs a <b>single</b> real disk
read.</li>
</ul>
<p>Two structural details of the B+ tree matter:</p>
<ol>
<li><b>All records live in the leaves</b>; internal nodes hold only keys for navigation. That
keeps the fanout as high as possible.</li>
<li><b>The leaves are linked in a list</b>, so once you find the start of a range you can walk
sideways. This is why a B+ tree serves <code>BETWEEN</code>, <code>&gt;</code>,
<code>ORDER BY</code> and prefix <code>LIKE 'abc%'</code>, and why it is the default index
type everywhere.</li>
</ol>
<p>A <b>hash index</b>, by contrast, gives O(1) equality lookups and is <b>useless for ranges
or ordering</b>, because hashing destroys order. Use it only for exact-match-only workloads.</p>

<h2>Clustered vs non-clustered</h2>
<div class="tbl"><table>
<tr><th></th><th>Clustered</th><th>Non-clustered (secondary)</th></tr>
<tr><td>What it is</td><td>The table itself, stored in index order</td><td>A separate structure pointing at rows</td></tr>
<tr><td>How many</td><td><b>One per table</b> — a table can only be physically sorted one way</td><td>Many</td></tr>
<tr><td>Leaf contains</td><td>The full row</td><td>The key plus a row locator (often the clustered key)</td></tr>
<tr><td>Range queries</td><td>Excellent — rows are physically adjacent</td><td>Good for finding rows, then random I/O to fetch them</td></tr>
</table></div>
<p>The consequence of the last row is the <b>lookup</b> problem: a non-clustered index finds
the key, then must go to the table for the remaining columns. If the index already contains
every column the query needs, that second step is skipped — a <b>covering index</b>, and the
plan reads "index only scan". Designing one is the standard way to make a hot query fast.</p>

<h2>Composite indexes and the leftmost-prefix rule</h2>
<p>An index on (A, B, C) sorts by A, then B within equal A, then C. So it can serve a
predicate on A, on (A, B), or on (A, B, C) — but <b>not on B alone, nor on C alone</b>. The
analogy is a phone book sorted by surname then first name: finding everyone called Sharma is
easy, finding everyone called Ravi is a full scan.</p>
<p>Column order therefore matters enormously, and the rule of thumb is to put <b>equality
predicates before range predicates</b>: with an index on (status, created_at), a query
filtering <code>status = 'open' AND created_at &gt; x</code> uses both columns, whereas
(created_at, status) uses only the first.</p>

<h2>What indexes cost</h2>
<ul>
<li><b>Writes get slower.</b> Every INSERT, UPDATE or DELETE must also update every affected
index. A table with eight indexes does nine write operations per insert.</li>
<li><b>Storage.</b> Indexes are often a large fraction of a database's size.</li>
<li><b>Maintenance.</b> Pages split and fragment over time.</li>
</ul>
<p>Hence the rule: index for the queries you actually run, and drop indexes nothing uses.
Write-heavy tables want few indexes; read-heavy tables can afford many.</p>

<h2>When an index exists and is not used</h2>
<p>This is the practical part interviewers probe, because it explains most "but I added an
index" confusion:</p>
<ul>
<li><b>Low selectivity.</b> If a value matches 40% of rows, scanning the table sequentially
beats jumping randomly through it via the index. Indexing a boolean or a gender column is
usually pointless.</li>
<li><b>A function on the column.</b> <code>WHERE YEAR(created_at) = 2024</code> cannot use an
index on <code>created_at</code>, because the index stores the column, not the function of it.
Rewrite as a range, or build an expression index.</li>
<li><b>A leading wildcard.</b> <code>LIKE '%abc'</code> has no prefix to seek on.
<code>LIKE 'abc%'</code> does.</li>
<li><b>Type mismatches</b> that force an implicit conversion, and <code>OR</code> across
different columns.</li>
<li><b>NULL handling</b> and negation (<code>!=</code>, <code>NOT IN</code>) often defeat it
too.</li>
</ul>
<div class="say"><em>Say it like this</em>An index is a bet that reads outnumber writes and
that the predicate is selective. When either half of that bet is wrong, the index costs more
than it saves. Confirm with EXPLAIN rather than assuming.</div>`,
  notes:`
<h3>What an index is</h3>
<p>An auxiliary structure mapping column values to row locations, so lookups avoid a full table scan. Speeds up <b>SELECT/WHERE/JOIN/ORDER BY</b>; slows down <b>INSERT/UPDATE/DELETE</b> and uses extra storage.</p>
<h3>Clustered vs Non-clustered</h3>
<div class="tbl"><table>
<tr><th></th><th>Clustered</th><th>Non-clustered</th></tr>
<tr><td>Storage</td><td>Determines the physical order of rows</td><td>Separate structure pointing at rows</td></tr>
<tr><td>How many</td><td><b>One per table</b></td><td>Many</td></tr>
<tr><td>Leaf node holds</td><td>The actual data row</td><td>A pointer / the clustering key</td></tr>
<tr><td>Speed</td><td>Faster for range scans</td><td>Extra lookup to fetch the row</td></tr>
</table></div>
<p>In most systems the <b>primary key gets the clustered index</b> by default.</p>
<h3>Structures</h3>
<ul>
<li><b>B+ tree</b> — the default. All data in leaves, leaves linked for range scans, balanced so every lookup is the same depth. Good for <code>=</code>, <code>&lt;</code>, <code>BETWEEN</code>, <code>ORDER BY</code>.</li>
<li><b>Hash index</b> — O(1) for equality, <b>useless for ranges</b>.</li>
<li><b>Dense index</b> — an entry for every record. <b>Sparse</b> — an entry per block; smaller, needs ordered data.</li>
<li><b>Composite index (A, B)</b> — usable for queries on A, or A and B, but <b>not on B alone</b> (leftmost-prefix rule).</li>
</ul>
<h3>When an index is not used</h3>
<ul>
<li>A function or arithmetic wraps the column: <code>WHERE YEAR(dt) = 2026</code>.</li>
<li>A leading wildcard: <code>LIKE '%abc'</code>.</li>
<li>The column has very low <b>cardinality</b> (e.g. a boolean) — a scan is cheaper.</li>
</ul>`,
  mcqs:[
  {q:"How many clustered indexes can a table have?",o:["One","Two","As many as needed","None"],a:0,
   w:"A clustered index defines the <b>physical order</b> of the rows, and rows can only be ordered one way — so exactly one per table."},
  {q:"Which index type is unsuitable for range queries?",o:["B+ tree","Hash index","Clustered index","Composite index"],a:1,
   w:"A <b>hash index</b> maps values to buckets with no ordering, so it cannot answer <code>BETWEEN</code> or <code>&gt;</code> efficiently."},
  {q:"Given a composite index on (last_name, first_name), which query can use it?",o:["WHERE first_name = 'Amit'","WHERE last_name = 'Sharma'","WHERE first_name = 'Amit' AND city = 'Pune'","None of these"],a:1,
   w:"The <b>leftmost prefix</b> rule: the index is usable for <code>last_name</code>, or <code>last_name + first_name</code>, but not for <code>first_name</code> alone."},
  {q:"Adding many indexes to a table primarily hurts",o:["SELECT performance","INSERT, UPDATE and DELETE performance","Referential integrity","Normalization"],a:1,
   w:"Every index must be maintained on write, so <b>writes</b> get slower and storage grows. Reads are what indexes are for."},
  {q:"In a B+ tree index, actual data records are stored",o:["In the root","In internal nodes","Only in the leaf nodes","Randomly"],a:2,
   w:"A <b>B+ tree</b> keeps all keys/records in the leaves, which are linked together — this is exactly what makes range scans efficient."},
  {q:"The query WHERE UPPER(name) = 'AMIT' on an indexed name column will typically",o:["Use the index","Not use the index because the column is wrapped in a function","Fail","Rebuild the index"],a:1,
   w:"Applying a function to the column means the stored index values no longer match what is being compared, so the optimiser falls back to a scan."}]},

{ id:"db5", t:"SQL Joins and Query Essentials", freq:3,
  lead:"Joins plus the execution order of a SELECT. Both appear constantly.",
  theory:`
<h2>The join is the relational model's core operation</h2>
<p>Normalization splits data across tables on purpose, so nearly every real query has to put
it back together. A join matches rows of one table against rows of another on a condition and
produces the combined rows — and the join <i>type</i> decides what happens to rows that find
no match.</p>
<div class="tbl"><table>
<tr><th>Join</th><th>Returns</th></tr>
<tr><td><b>INNER</b></td><td>Only rows matching on both sides. The default.</td></tr>
<tr><td><b>LEFT OUTER</b></td><td>All left rows; right columns NULL where no match.</td></tr>
<tr><td><b>RIGHT OUTER</b></td><td>All right rows; left columns NULL where no match.</td></tr>
<tr><td><b>FULL OUTER</b></td><td>All rows from both, NULL-padded on either side.</td></tr>
<tr><td><b>CROSS</b></td><td>Cartesian product — every combination. m × n rows.</td></tr>
<tr><td><b>SELF</b></td><td>A table joined to itself with aliases, e.g. employee to manager.</td></tr>
</table></div>
<p>Two things follow. <b>LEFT JOIN … WHERE right.id IS NULL</b> is the idiom for "rows in A
with nothing in B" — customers who never ordered, say. And a missing join condition silently
produces a cross join, which is how a query that should return 1000 rows returns a million.</p>

<div class="ex"><em>The ON vs WHERE trap</em>
<p>These two look alike and are not:</p>
<p><code>FROM a LEFT JOIN b ON a.id = b.a_id <b>AND</b> b.status = 'x'</code> — the condition
is part of the match. Every row of <code>a</code> is still returned; those whose <code>b</code>
rows fail the test simply get NULLs.</p>
<p><code>FROM a LEFT JOIN b ON a.id = b.a_id <b>WHERE</b> b.status = 'x'</code> — the filter
runs <i>after</i> the join, and NULL fails every comparison, so the unmatched rows are
discarded. <b>The LEFT JOIN has silently become an INNER JOIN.</b></p>
<p>Rule: conditions on the outer (nullable) table belong in <code>ON</code>; conditions on the
preserved table belong in <code>WHERE</code>.</p></div>

<h2>The order SQL actually executes in</h2>
<p>You write SELECT first, but the engine evaluates it nearly last. The logical order is:</p>
<p><code>FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT</code></p>
<p>Almost every "why does this not work" question about SQL is answered by this list:</p>
<ul>
<li><b>WHERE cannot use an aggregate</b> — it runs before GROUP BY, so SUM does not exist yet.
That is what HAVING is for.</li>
<li><b>WHERE cannot use a SELECT alias</b> (in most engines) — the alias is not defined yet.</li>
<li><b>ORDER BY can</b> use one, because it runs after SELECT.</li>
<li><b>WHERE filters rows, HAVING filters groups.</b> Filtering in WHERE first is also faster,
because fewer rows reach the grouping.</li>
</ul>

<h2>NULL is not a value</h2>
<p>NULL means <i>unknown</i>, and every comparison with it yields unknown rather than true or
false. Hence:</p>
<ul>
<li><code>= NULL</code> never matches. Use <code>IS NULL</code> / <code>IS NOT NULL</code>.</li>
<li><code>COUNT(*)</code> counts rows; <code>COUNT(column)</code> <b>skips NULLs</b>. So the
two differ exactly by the number of NULLs — a classic trick question.</li>
<li>SUM, AVG and the rest ignore NULLs, so AVG over a column with NULLs divides by the count of
non-null values, not the row count.</li>
<li><code>NOT IN</code> with a subquery containing a NULL returns nothing at all. Prefer
<code>NOT EXISTS</code>.</li>
</ul>

<h2>Set operations and subqueries</h2>
<p><b>UNION</b> removes duplicates and therefore sorts; <b>UNION ALL</b> does not and is
substantially faster — use it whenever you know duplicates are impossible or acceptable.
<b>INTERSECT</b> and <b>EXCEPT / MINUS</b> complete the set.</p>
<p>A <b>correlated subquery</b> references the outer query and is conceptually re-evaluated
per outer row, which is why it can be slow; a plain subquery runs once. <code>EXISTS</code>
stops at the first match, so it is usually preferable to <code>IN</code> over a large
subquery.</p>

<div class="ex"><em>Worked example — the Nth highest salary</em>
<p>The most-asked SQL question, and the window-function answer is the one to give:</p>
<p><code>SELECT DISTINCT salary FROM (SELECT salary, DENSE_RANK() OVER (ORDER BY salary DESC)
AS r FROM employees) t WHERE r = 2;</code></p>
<p>Use <b>DENSE_RANK</b>, not RANK: with salaries 100, 100, 90, RANK gives 1, 1, 3 and the
second-highest query returns nothing, while DENSE_RANK gives 1, 1, 2 and returns 90 correctly.
The portable alternative without window functions is a correlated subquery counting distinct
higher salaries.</p></div>

<h2>Removing data: three different operations</h2>
<div class="tbl"><table>
<tr><th></th><th>DELETE</th><th>TRUNCATE</th><th>DROP</th></tr>
<tr><td>Type</td><td>DML</td><td>DDL</td><td>DDL</td></tr>
<tr><td>WHERE clause</td><td>Yes</td><td>No — all rows</td><td>n/a</td></tr>
<tr><td>Rollback</td><td>Yes</td><td>Generally no (auto-commits)</td><td>No</td></tr>
<tr><td>Speed</td><td>Slow — logs each row, fires triggers</td><td>Fast — deallocates pages</td><td>Fast</td></tr>
<tr><td>Structure</td><td>Kept</td><td>Kept</td><td><b>Removed</b></td></tr>
<tr><td>Identity counter</td><td>Kept</td><td>Reset</td><td>n/a</td></tr>
</table></div>
<p>And the four sub-languages, worth naming precisely: <b>DDL</b> (CREATE, ALTER, DROP,
TRUNCATE), <b>DML</b> (SELECT, INSERT, UPDATE, DELETE), <b>DCL</b> (GRANT, REVOKE), <b>TCL</b>
(COMMIT, ROLLBACK, SAVEPOINT).</p>`,
  notes:`
<h3>Joins</h3>
<div class="tbl"><table>
<tr><th>Join</th><th>Returns</th></tr>
<tr><td><b>INNER</b></td><td>Only rows matching in both tables</td></tr>
<tr><td><b>LEFT (OUTER)</b></td><td>All rows from the left + matches; NULLs where none</td></tr>
<tr><td><b>RIGHT (OUTER)</b></td><td>All rows from the right + matches</td></tr>
<tr><td><b>FULL OUTER</b></td><td>All rows from both, NULLs where unmatched</td></tr>
<tr><td><b>CROSS</b></td><td>Cartesian product — m × n rows</td></tr>
<tr><td><b>SELF</b></td><td>A table joined to itself (e.g. employee → manager)</td></tr>
</table></div>
<h3>Logical execution order</h3>
<p><code>FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT</code></p>
<p>This is why you <b>cannot use a SELECT alias in WHERE</b> (WHERE runs first) but <b>can in ORDER BY</b>.</p>
<h3>WHERE vs HAVING</h3>
<ul>
<li><b>WHERE</b> filters individual rows, <i>before</i> grouping. Cannot contain aggregates.</li>
<li><b>HAVING</b> filters groups, <i>after</i> GROUP BY. Can contain aggregates.</li>
</ul>
<h3>Things asked every time</h3>
<ul>
<li><b>DELETE vs TRUNCATE vs DROP</b> — DELETE (DML, row-by-row, WHERE allowed, rollback-able) · TRUNCATE (DDL, removes all rows, resets identity, faster) · DROP (removes the table itself).</li>
<li><b>UNION vs UNION ALL</b> — UNION removes duplicates (and sorts); <b>UNION ALL</b> keeps them and is faster.</li>
<li><b>COUNT(*) vs COUNT(col)</b> — COUNT(*) counts rows; COUNT(col) <b>skips NULLs</b>.</li>
<li><b>NULL</b> is not equal to anything, including itself. Use <code>IS NULL</code>, never <code>= NULL</code>.</li>
</ul>
<div class="say"><em>Classic query</em>Second-highest salary: <code>SELECT MAX(salary) FROM emp WHERE salary &lt; (SELECT MAX(salary) FROM emp);</code> — or <code>ORDER BY salary DESC LIMIT 1 OFFSET 1</code>.</div>`,
  mcqs:[
  {q:"Which join returns all rows from the left table even when there is no match?",o:["INNER JOIN","LEFT JOIN","CROSS JOIN","SELF JOIN"],a:1,
   w:"<b>LEFT JOIN</b> keeps every left-hand row, filling the right-hand columns with NULL where no match exists."},
  {q:"Tables A (5 rows) and B (4 rows) are combined with CROSS JOIN. How many rows result?",o:["9","20","5","4"],a:1,
   w:"A cross join is the Cartesian product: <b>5 × 4 = 20</b> rows."},
  {q:"HAVING differs from WHERE in that HAVING",o:["Runs before grouping","Filters groups after GROUP BY and can use aggregates","Cannot be used with SELECT","Is faster"],a:1,
   w:"<b>WHERE</b> filters rows before grouping; <b>HAVING</b> filters the resulting groups and may reference aggregate functions."},
  {q:"Which statement about TRUNCATE is correct?",o:["It is a DML command","It can have a WHERE clause","It removes all rows and is generally faster than DELETE","It removes the table structure"],a:2,
   w:"<b>TRUNCATE</b> is DDL, removes every row by deallocating pages rather than logging each deletion, accepts no WHERE, and leaves the table structure intact."},
  {q:"COUNT(column_name) differs from COUNT(*) because it",o:["Counts only distinct values","Ignores NULL values in that column","Is always slower","Counts columns, not rows"],a:1,
   w:"<b>COUNT(col)</b> counts non-NULL values only. COUNT(*) counts all rows regardless of NULLs."},
  {q:"Which comparison correctly tests for a NULL value?",o:["value = NULL","value == NULL","value IS NULL","value <> NULL"],a:2,
   w:"NULL is unknown, so any comparison with <code>=</code> yields unknown. Only <b>IS NULL</b> / <b>IS NOT NULL</b> work."},
  {q:"UNION differs from UNION ALL in that UNION",o:["Is faster","Removes duplicate rows","Allows different column counts","Sorts by the last column"],a:1,
   w:"<b>UNION</b> eliminates duplicates, which requires a sort or hash and therefore costs more. UNION ALL simply concatenates."}]}
]},

{ id:"oop", name:"Object-Oriented Programming", short:"OOPs", v:"--oop", topics:[

{ id:"op1", t:"The Four Pillars", freq:3,
  lead:"The opening question of nearly every OOP round. Answer with an example each.",
  theory:`
<h2>What object orientation is reacting against</h2>
<p>In procedural code, data and the functions that operate on it are separate. Any function
can modify any structure, so when a value goes wrong the suspect list is the entire program,
and changing a data layout means auditing every function that touched it.</p>
<p>OOP's move is to bind data to the operations allowed on it, and then to expose only those
operations. A <b>class</b> is the blueprint — a user-defined type describing state and
behaviour. An <b>object</b> is an instance of it, occupying memory and holding actual values.
The class is the cookie cutter; the objects are the cookies.</p>

<h2>Encapsulation — keeping the invariants safe</h2>
<p>Bundle the data with its methods and restrict direct access to the data. The reason is not
secrecy, it is <b>invariants</b>: a BankAccount whose balance is public can be set to −5000 by
any line of code in the program. Make it private with a <code>withdraw()</code> method and the
rule "balance never goes negative" can be enforced in exactly one place, which is also the only
place you need to look when it is violated.</p>
<div class="tbl"><table>
<tr><th>Modifier</th><th>Same class</th><th>Same package</th><th>Subclass (other package)</th><th>Anywhere</th></tr>
<tr><td>private</td><td>Yes</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>default (package-private)</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>protected</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>public</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
</table></div>
<p>The second benefit is freedom to change: as long as the methods keep their signatures, the
fields behind them can be restructured without breaking a single caller.</p>

<h2>Abstraction — and how it differs from encapsulation</h2>
<p>Abstraction is showing <b>what</b> an object does and hiding <b>how</b>. Driving a car needs
the pedal, not the combustion cycle. It is achieved with abstract classes and interfaces — a
declared set of operations with the implementation elsewhere.</p>
<div class="say"><em>Say it like this</em>Abstraction is a <b>design</b> concern — deciding
which details the outside world needs. Encapsulation is the <b>implementation</b> that enforces
that decision, by restricting access. Abstraction hides complexity; encapsulation hides data.
Interviewers ask this because most candidates blur them.</div>

<h2>Inheritance — reuse, and a warning</h2>
<p>A subclass acquires the members of its parent and may add or replace behaviour. The
relationship it expresses is <b>is-a</b>: a Dog is an Animal. Forms:</p>
<ul>
<li><b>Single</b> — one parent.</li>
<li><b>Multilevel</b> — a chain: C extends B extends A.</li>
<li><b>Hierarchical</b> — several subclasses of one parent.</li>
<li><b>Multiple</b> — several parents. C++ allows it; <b>Java does not for classes</b>.</li>
<li><b>Hybrid</b> — a combination.</li>
</ul>
<h4>The diamond problem</h4>
<p>If B and C both extend A and D extends both, and B and C each override the same method,
which does D inherit? Worse, D may contain two copies of A's state. C++ answers with
<b>virtual inheritance</b>; Java sidesteps it by permitting only single class inheritance while
allowing <b>multiple interfaces</b> — interfaces carried no state, so there was nothing to
duplicate. Java 8's default methods reintroduced a mild version, resolved by requiring the
class to override the conflict explicitly.</p>
<h4>Prefer composition</h4>
<p>Inheritance is the tightest coupling available: the subclass depends on the parent's
internals, and a change upstream can break it silently — the <b>fragile base class</b>
problem. It is also fixed at compile time. <b>Composition</b> ("has-a": a Car <i>has</i> an
Engine) is looser, changeable at runtime, and does not force one rigid hierarchy. The standard
advice, and the right answer when asked: <b>use inheritance only for a genuine is-a
relationship where substitutability holds; otherwise compose.</b></p>

<h2>Polymorphism — one interface, many behaviours</h2>
<p>Two distinct kinds, and mixing them up is the commonest error in this topic:</p>
<ul>
<li><b>Compile-time (static) polymorphism</b> — method <b>overloading</b> and operator
overloading. The compiler picks the version from the declared argument types. Also called
<b>early binding</b>.</li>
<li><b>Runtime (dynamic) polymorphism</b> — method <b>overriding</b>. The call is resolved
from the <i>actual object</i>, not the reference type, so <code>Animal a = new Dog(); a.speak();</code>
runs Dog's version. Also called <b>late binding</b>.</li>
</ul>
<p>The mechanism behind runtime dispatch is the <b>vtable</b>: each polymorphic class has a
table of function pointers, each object holds a pointer to its class's table, and a virtual
call is an indirection through it. That is why it costs slightly more than a direct call, and
why in C++ you must write <code>virtual</code> to opt in — in Java every non-static,
non-final method is virtual by default.</p>
<p>The payoff is <b>open extension</b>: write <code>for (Shape s : shapes) s.draw();</code> and
a Triangle class added next year works without that loop being touched. That is exactly the
Open/Closed Principle, and it is why polymorphism is the pillar the others exist to support.</p>`,
  notes:`
<h3>The four</h3>
<ul>
<li><b>Encapsulation</b> — bundle data and the methods that operate on it, and restrict direct access. Achieved with private fields plus public getters/setters. <i>Benefit:</i> the internal representation can change without breaking callers.</li>
<li><b>Abstraction</b> — expose only what matters and hide the implementation. Achieved with abstract classes and interfaces. <i>Benefit:</i> callers depend on <b>what</b>, not <b>how</b>.</li>
<li><b>Inheritance</b> — a class acquires the properties and behaviour of another (IS-A). <i>Benefit:</i> reuse and a type hierarchy.</li>
<li><b>Polymorphism</b> — one interface, many implementations. Compile-time (overloading) and run-time (overriding).</li>
</ul>
<h3>Abstraction vs Encapsulation</h3>
<div class="tbl"><table>
<tr><th></th><th>Abstraction</th><th>Encapsulation</th></tr>
<tr><td>Hides</td><td>Complexity / implementation</td><td>Data</td></tr>
<tr><td>Level</td><td>Design</td><td>Implementation</td></tr>
<tr><td>Achieved by</td><td>Abstract classes, interfaces</td><td>Access modifiers</td></tr>
<tr><td>Question answered</td><td>What does it do?</td><td>How is the data protected?</td></tr>
</table></div>
<h3>Types of inheritance</h3>
<p>Single · Multilevel (A→B→C) · Hierarchical (one parent, many children) · Multiple (many parents — <b>not supported for classes in Java/C#</b>) · Hybrid.</p>
<p><b>Diamond problem</b> — with multiple inheritance, an ambiguous member inherited along two paths. C++ resolves it with <b>virtual inheritance</b>; Java avoids it by allowing multiple <i>interfaces</i> only.</p>
<h3>Association relationships</h3>
<ul>
<li><b>Association</b> — general "uses a".</li>
<li><b>Aggregation</b> — HAS-A, weak: parts survive the whole (Department has Professors).</li>
<li><b>Composition</b> — HAS-A, strong: parts die with the whole (House has Rooms).</li>
</ul>`,
  mcqs:[
  {q:"Hiding internal data and exposing it only through methods is",o:["Abstraction","Encapsulation","Polymorphism","Inheritance"],a:1,
   w:"<b>Encapsulation</b> binds data with its methods and restricts direct access, typically with private fields and public accessors."},
  {q:"The diamond problem is avoided in Java by",o:["Using virtual functions","Not allowing multiple inheritance of classes","Making all methods static","Using abstract classes only"],a:1,
   w:"Java permits a class to extend only one class, so the ambiguity cannot arise. Multiple <b>interfaces</b> are allowed because they carry no state."},
  {q:"Which relationship is strongest — the part cannot exist without the whole?",o:["Association","Aggregation","Composition","Inheritance"],a:2,
   w:"<b>Composition</b> is strong HAS-A: destroy the whole and the parts are destroyed too (a House and its Rooms)."},
  {q:"Abstraction is best described as hiding",o:["Data","Implementation details","Method names","Class names"],a:1,
   w:"<b>Abstraction</b> exposes what an object does and hides how it does it. Encapsulation is what hides the data."},
  {q:"A → B → C, where B extends A and C extends B, is an example of",o:["Multiple inheritance","Multilevel inheritance","Hierarchical inheritance","Hybrid inheritance"],a:1,
   w:"A chain of inheritance is <b>multilevel</b>. Hierarchical is one parent with several children; multiple is one child with several parents."},
  {q:"Polymorphism literally means",o:["Many classes","Many forms","Many objects","Many parameters"],a:1,
   w:"From Greek <i>poly</i> (many) + <i>morph</i> (form) — the same interface taking many forms."}]},

{ id:"op2", t:"Overloading, Overriding and Binding", freq:3,
  lead:"The single most asked OOP comparison. Get the table exactly right.",
  theory:`
<h2>Two different mechanisms with similar names</h2>
<p><b>Overloading</b> is several methods in the <i>same</i> class sharing a name but differing
in parameters. <b>Overriding</b> is a subclass replacing a method it inherited. One is resolved
by the compiler, the other by the runtime, and every other difference follows from that.</p>
<div class="tbl"><table>
<tr><th></th><th>Overloading</th><th>Overriding</th></tr>
<tr><td>Where</td><td>Same class (or inherited into it)</td><td>Subclass</td></tr>
<tr><td>Signature</td><td><b>Must differ</b> in parameters</td><td><b>Must be identical</b></td></tr>
<tr><td>Return type</td><td>May differ — but cannot be the only difference</td><td>Same, or a covariant subtype</td></tr>
<tr><td>Resolved</td><td>Compile time, from the declared type</td><td>Runtime, from the actual object</td></tr>
<tr><td>Binding</td><td>Static / early</td><td>Dynamic / late</td></tr>
<tr><td>Polymorphism</td><td>Compile-time</td><td>Runtime</td></tr>
<tr><td>static / private / final</td><td>Can be overloaded</td><td><b>Cannot be overridden</b></td></tr>
</table></div>

<h2>Overloading, precisely</h2>
<p>The parameter list must differ in <b>number</b>, <b>type</b>, or <b>order</b> of parameters.
<code>add(int, int)</code> and <code>add(double, double)</code> are valid overloads;
<code>int add(int, int)</code> and <code>double add(int, int)</code> are not — a call site like
<code>add(2, 3)</code> would be ambiguous, since the compiler cannot know which return type you
wanted. <b>Return type alone is not part of the signature.</b></p>
<p>Resolution happens entirely at compile time, using the <i>declared</i> types, and prefers
the most specific applicable overload, trying exact match, then widening, then autoboxing, then
varargs. This produces a result that surprises people:</p>
<div class="ex"><em>Overload resolution uses the reference type</em>
<p>Given <code>void f(Object o)</code> and <code>void f(String s)</code>, calling
<code>Object x = "hello"; f(x);</code> invokes <b>f(Object)</b> — because <code>x</code> is
<i>declared</i> Object, and overloading never looks at what the object actually is at runtime.
Overriding does exactly the opposite.</p></div>

<h2>Overriding, precisely</h2>
<p>Rules, all of which come from the requirement that a subclass must be usable wherever the
parent is:</p>
<ul>
<li>Same name and <b>same parameter list</b>. Change the parameters and you have written an
overload, not an override — which is the single most common OOP bug, and why
<code>@Override</code> exists: it makes the compiler check.</li>
<li>Return type identical, or a <b>covariant</b> subtype (an override may return Dog where the
parent returned Animal).</li>
<li>Access may be <b>widened but never narrowed</b> — public cannot become protected, or a
caller holding a parent reference would lose access to a method the contract promised.</li>
<li>It may throw <b>fewer or narrower</b> checked exceptions, never broader ones. Unchecked
exceptions are unrestricted.</li>
<li><b>final</b> methods cannot be overridden; <b>private</b> ones are not inherited, so they
cannot be either; <b>static</b> ones are hidden, not overridden; constructors are never
inherited.</li>
</ul>

<h2>Binding: where the decision is made</h2>
<p><b>Static binding</b> happens at compile time, from the reference's declared type. It
applies to overloaded methods, static methods, private methods, final methods, and — crucially
— <b>fields</b>.</p>
<p><b>Dynamic binding</b> happens at runtime, from the object's actual class, via the vtable.
It applies to overridden instance methods.</p>
<div class="ex"><em>The two classic traps</em>
<p><b>Fields are not polymorphic.</b> If Parent has <code>String name = "parent"</code> and
Child has <code>String name = "child"</code>, then <code>Parent p = new Child(); p.name</code>
gives <b>"parent"</b> — field access is resolved by the reference type — while an overridden
<code>p.getName()</code> gives "child". Hide fields and confuse everyone; that is why fields
should be private in the first place.</p>
<p><b>Static methods are hidden, not overridden.</b> Declaring the same static method in a
subclass hides the parent's. <code>Parent p = new Child(); p.staticMethod();</code> calls
<b>Parent's</b>, because static dispatch uses the declared type. Calling a static method
through an instance reference is legal and misleading — call it on the class.</p></div>

<h2>C++ differences worth stating</h2>
<p>In Java every non-static, non-final method is virtual automatically. In <b>C++ you must
write <code>virtual</code></b>; without it, calling through a base pointer runs the base
version even for a derived object, which is the classic C++ slicing-and-dispatch bug. C++ also
requires a <b>virtual destructor</b> on any class deleted through a base pointer, or the
derived destructor never runs and resources leak. C++11 added <code>override</code> and
<code>final</code> to have the compiler check intent, the same role as Java's
<code>@Override</code>.</p>`,
  notes:`
<h3>Overloading vs Overriding</h3>
<div class="tbl"><table>
<tr><th></th><th>Overloading</th><th>Overriding</th></tr>
<tr><td>Also called</td><td>Compile-time polymorphism</td><td>Run-time polymorphism</td></tr>
<tr><td>Where</td><td>Same class (or subclass)</td><td>Base and derived class</td></tr>
<tr><td>Signature</td><td><b>Must differ</b> (count/type/order of parameters)</td><td><b>Must be identical</b></td></tr>
<tr><td>Return type</td><td>May differ; cannot differ alone</td><td>Same, or a covariant subtype</td></tr>
<tr><td>Resolved</td><td>At compile time (static binding)</td><td>At run time (dynamic binding)</td></tr>
<tr><td>Inheritance needed</td><td>No</td><td>Yes</td></tr>
</table></div>
<p><b>Return type alone cannot overload a method</b> — the compiler could not tell which one you meant.</p>
<h3>Static vs Dynamic binding</h3>
<ul>
<li><b>Static (early) binding</b> — resolved at compile time. Applies to overloaded, <code>private</code>, <code>static</code> and <code>final</code> methods.</li>
<li><b>Dynamic (late) binding</b> — resolved at run time from the <b>actual object type</b>, not the reference type. This is what makes overriding work.</li>
</ul>
<h3>Virtual functions (C++)</h3>
<ul>
<li>Declared <code>virtual</code> in the base class; the call is dispatched through a <b>vtable</b> by actual object type.</li>
<li>Without <code>virtual</code>, a base-class pointer calls the <b>base</b> version — the classic C++ trap.</li>
<li><b>Pure virtual</b>: <code>virtual void f() = 0;</code> makes the class <b>abstract</b> — it cannot be instantiated.</li>
<li>A base class with any virtual function needs a <b>virtual destructor</b>, or deleting through a base pointer leaks the derived part.</li>
</ul>
<h3>Rules for overriding</h3>
<p>Cannot override <code>static</code>, <code>final</code> or <code>private</code> methods. The override cannot <b>reduce</b> visibility (public cannot become protected). Constructors are never inherited and never overridden.</p>`,
  mcqs:[
  {q:"Method overloading is resolved",o:["At run time","At compile time","At link time","By the JVM only"],a:1,
   w:"The compiler picks the overload from the <b>static types of the arguments</b>, so it is compile-time (static) polymorphism."},
  {q:"Two methods differing only in return type are",o:["Valid overloads","Valid overrides","A compile error","Resolved at run time"],a:2,
   w:"Return type is not part of the signature used for overload resolution, so the compiler cannot disambiguate — it is an <b>error</b>."},
  {q:"In C++, a base-class pointer calls a derived override only if the base method is declared",o:["static","const","virtual","inline"],a:2,
   w:"Without <code>virtual</code> the call is bound statically to the base version. <b>virtual</b> enables vtable dispatch on the actual object type."},
  {q:"Which method cannot be overridden?",o:["A public method","A protected method","A final method","An abstract method"],a:2,
   w:"<b>final</b> (Java) / <code>sealed</code> explicitly forbids overriding. Static and private methods also cannot be overridden."},
  {q:"A class containing at least one pure virtual function is",o:["A concrete class","An abstract class","An interface in C++ terms only","A friend class"],a:1,
   w:"A pure virtual function makes the class <b>abstract</b>: it cannot be instantiated and derived classes must implement the function."},
  {q:"Omitting a virtual destructor in a polymorphic base class causes",o:["A compile error","The derived destructor not to run when deleting via a base pointer","Slower construction","Loss of encapsulation"],a:1,
   w:"Deletion through a base pointer calls only the base destructor, so derived resources leak. Always make the base destructor <b>virtual</b>."},
  {q:"An overriding method in a subclass may NOT",o:["Have the same name","Reduce the visibility of the method","Throw fewer exceptions","Return a covariant type"],a:1,
   w:"Overrides cannot <b>weaken access</b> — a public method cannot become protected — or the substitution principle would be violated."}]},

{ id:"op3", t:"Abstract Class vs Interface", freq:3,
  lead:"Asked in essentially every round, usually as \"when would you use which?\".",
  theory:`
<h2>Two ways to declare a contract</h2>
<p>Both let you program against a type without knowing the concrete class. They differ in what
else they are allowed to carry, and choosing between them is a question about <b>what
relationship you are modelling</b>, not about syntax.</p>

<h2>Abstract class</h2>
<p>A class that cannot be instantiated, declared <code>abstract</code>. Key properties:</p>
<ul>
<li>May contain <b>both abstract and concrete methods</b> — so it can supply shared
implementation.</li>
<li>May have <b>instance fields and state</b>, and <b>constructors</b> (run via
<code>super()</code> when a subclass is created, even though you cannot instantiate it
directly).</li>
<li>Members may have any access modifier, including private and protected.</li>
<li>A class extends <b>exactly one</b> of them.</li>
<li>A class containing even one abstract method <i>must</i> be abstract; an abstract class is
allowed to contain none.</li>
</ul>
<p>It expresses <b>is-a with shared substance</b>: an abstract <code>Shape</code> holding a
colour field and a concrete <code>describe()</code>, leaving <code>area()</code> abstract.</p>

<h2>Interface</h2>
<p>A pure contract. Classically: all methods abstract and public, all fields implicitly
<code>public static final</code> constants, no state, no constructors — and a class may
implement <b>any number</b> of them.</p>
<p>It expresses a <b>capability</b> that can cut across unrelated hierarchies. A Bird and a
Plane share no sensible ancestor, but both can be <code>Flyable</code>. That is the case
inheritance cannot express and interfaces can.</p>
<h4>What Java added, and why it matters</h4>
<ul>
<li><b>Java 8 — default methods.</b> A method with a body in an interface, so a new method can
be added to a published interface without breaking every existing implementer. (This is
exactly why they were introduced: <code>forEach</code> had to be added to
<code>Collection</code>.)</li>
<li><b>Java 8 — static methods</b> in interfaces, for utilities related to the type.</li>
<li><b>Java 9 — private methods</b>, to share code between default methods.</li>
</ul>
<p>Consequently the old one-line answer, "an interface cannot have implementations", is now
wrong. The distinction that <b>survives</b> is this: an interface still cannot hold instance
<b>state</b>, and a class can still implement many interfaces but extend only one class.</p>
<div class="ex"><em>Default methods and the diamond</em>
<p>If a class implements two interfaces that both provide a default method with the same
signature, it will not compile until the class <b>overrides it explicitly</b>. Inside that
override it may delegate with <code>InterfaceName.super.method()</code>. Java reintroduced
multiple inheritance of <i>behaviour</i> but refuses to guess when it is ambiguous.</p></div>

<h2>Choosing between them</h2>
<div class="tbl"><table>
<tr><th></th><th>Abstract class</th><th>Interface</th></tr>
<tr><td>Multiple inheritance</td><td>No — one only</td><td>Yes — any number</td></tr>
<tr><td>Instance state</td><td><b>Yes</b></td><td><b>No</b></td></tr>
<tr><td>Constructors</td><td>Yes</td><td>No</td></tr>
<tr><td>Method bodies</td><td>Yes</td><td>Yes, via default / static (Java 8+)</td></tr>
<tr><td>Access modifiers</td><td>Any</td><td>Public (private allowed since 9, internal use)</td></tr>
<tr><td>Fields</td><td>Any kind</td><td>public static final constants only</td></tr>
<tr><td>Models</td><td>is-a, with shared implementation</td><td>can-do, a capability</td></tr>
</table></div>
<p>Practical rules:</p>
<ul>
<li>Need to share <b>state</b> or constructor logic → abstract class.</li>
<li>Unrelated classes need the same <b>capability</b> → interface.</li>
<li>The type will be implemented by classes you do not control, and may need to grow → interface
(with defaults for evolution).</li>
<li>Both is common and idiomatic: define the interface for the contract, provide an abstract
base implementing the tedious parts (<code>List</code> and <code>AbstractList</code> are the
canonical pair).</li>
</ul>
<p>A <b>marker interface</b> (<code>Serializable</code>, <code>Cloneable</code>) declares no
methods at all and exists only to tag a class for special treatment — a historical technique
largely replaced by annotations.</p>`,
  notes:`
<h3>Comparison</h3>
<div class="tbl"><table>
<tr><th></th><th>Abstract class</th><th>Interface</th></tr>
<tr><td>Methods</td><td>Abstract and concrete</td><td>Abstract; default/static allowed in modern Java</td></tr>
<tr><td>Fields</td><td>Any, including state</td><td><code>public static final</code> constants only</td></tr>
<tr><td>Constructor</td><td>Yes</td><td>No</td></tr>
<tr><td>Multiple inheritance</td><td>No (one base class)</td><td><b>Yes</b> — many interfaces</td></tr>
<tr><td>Access modifiers</td><td>Any</td><td>Implicitly public</td></tr>
<tr><td>Relationship</td><td><b>IS-A</b></td><td><b>CAN-DO</b></td></tr>
</table></div>
<h3>Which to use</h3>
<ul>
<li><b>Abstract class</b> — closely related classes that share <b>state and code</b>. Example: <code>Shape</code> with a stored colour and a concrete <code>describe()</code>.</li>
<li><b>Interface</b> — unrelated classes that share a <b>capability</b>. Example: <code>Comparable</code>, <code>Serializable</code>, <code>Drawable</code>.</li>
<li>Rule of thumb: <b>"is a kind of" → abstract class; "is able to" → interface.</b></li>
</ul>

</table></div>`,

{ id:"op4", t:"Constructors and Object Copying", freq:2,
  lead:"Copy constructor and shallow vs deep copy are the reliable questions here.",
  theory:`
<h2>What a constructor is for</h2>
<p>An object should never exist in an invalid state, not even briefly. The constructor is the
one place that guarantees it: it runs automatically on creation, and until it finishes no
reference to the object escapes. Hence the rules — same name as the class, <b>no return
type</b> (not even void), and not callable again later.</p>
<ul>
<li><b>Default constructor</b> — supplied by the compiler <i>only if you declare none</i>.
Write any constructor and the free one disappears, which is why adding a parameterised
constructor can break <code>new Foo()</code> elsewhere.</li>
<li><b>Parameterised</b> — the usual case; constructors can be overloaded freely.</li>
<li><b>Copy constructor</b> — takes an existing object of the same class. C++ generates one
implicitly; Java has no such concept built in, and you write one by hand.</li>
</ul>
<p>Constructors are <b>not inherited</b>, cannot be <code>final</code>, <code>static</code> or
<code>abstract</code>, and in Java cannot be virtual. They <i>can</i> be <b>private</b> — which
is exactly how Singleton, Builder and static-factory patterns prevent direct construction.</p>

<h2>Chaining, and the order things run in</h2>
<p><code>this(...)</code> calls another constructor of the same class; <code>super(...)</code>
calls the parent's. Either must be the <b>first statement</b>, and you cannot use both, since
each must come first. If you write neither, the compiler inserts an implicit no-argument
<code>super()</code> — so a parent with only parameterised constructors forces every child to
call <code>super</code> explicitly.</p>
<p>For <code>new Child()</code>, the full order is:</p>
<ol>
<li>Static blocks and static field initialisers — <b>once per class</b>, parent before child,
at class-loading time.</li>
<li>Parent instance initialiser blocks and field initialisers, then the parent constructor
body.</li>
<li>Child instance initialiser blocks and field initialisers, then the child constructor body.</li>
</ol>
<p>The parent's constructor therefore finishes <b>before</b> the child's fields are
initialised. That produces a genuine trap: if the parent constructor calls an overridden
method, the child's version runs against uninitialised child fields and sees nulls and zeros.
<b>Never call an overridable method from a constructor.</b></p>

<h2>Shallow copy vs deep copy</h2>
<p>Assignment copies a <i>reference</i>, so both names point at one object — not a copy at all.
Beyond that, copying splits in two:</p>
<ul>
<li><b>Shallow copy</b> — a new object with the fields copied verbatim. Primitives are
duplicated; <b>reference fields still point at the same nested objects</b>, so the copy and the
original share them.</li>
<li><b>Deep copy</b> — a new object with every referenced object recursively copied too. Fully
independent.</li>
</ul>
<div class="ex"><em>Why it matters</em>
<p><code>Employee e2 = e1.clone();</code> with a shallow copy. Now
<code>e2.address.setCity("Pune")</code> also changes <code>e1</code>'s city, because both
Employee objects hold the same Address. The bug surfaces far from the copy, which is what makes
it expensive.</p>
<p>Java's <code>Object.clone()</code> is <b>shallow</b>, requires the class to implement the
<code>Cloneable</code> marker interface, and throws <code>CloneNotSupportedException</code>
otherwise. Ways to get a deep copy: write a copy constructor that copies each mutable field,
override <code>clone()</code> to clone the members too, or serialise and deserialise (simple,
slow, and requires everything to be serialisable).</p></div>
<p>The best fix is often to remove the question: make the nested objects <b>immutable</b>, and
shallow copying becomes safe by construction, since nobody can mutate the shared parts.</p>

<h2>The C++ side: the Rule of Three / Five</h2>
<p>Where Java has garbage collection, C++ has explicit ownership, so copying is a much larger
concern. If a class manages a resource — a raw pointer, a file handle, a socket — the
compiler's implicitly generated copies are shallow and will <b>double-free</b>. The rule: if
you need to define any one of <b>destructor</b>, <b>copy constructor</b> or <b>copy assignment
operator</b>, you almost certainly need all three. C++11 adds the <b>move constructor</b> and
<b>move assignment operator</b>, making it the Rule of Five — and the Rule of Zero, which says
to use types like <code>std::vector</code> and smart pointers that already manage themselves,
and write none of them.</p>
<p>Note also the <b>destructor</b>'s role: it runs deterministically when the object goes out
of scope, which is what makes <b>RAII</b> work — acquire in the constructor, release in the
destructor, and correctness no longer depends on remembering to clean up. Java has no
equivalent; <code>finalize()</code> is deprecated and was never guaranteed to run, so cleanup
is done with try-with-resources and <code>AutoCloseable</code>.</p>

<h2>Objects and memory, briefly</h2>
<p>In Java, objects live on the <b>heap</b> and references on the <b>stack</b>; garbage
collection reclaims objects no longer reachable from any root. In C++ the programmer chooses —
stack objects are destroyed automatically at scope exit, heap objects require
<code>delete</code> or a smart pointer. This is also the honest answer to "does Java pass by
reference?": <b>Java is always pass by value</b> — the <i>value of the reference</i> is copied,
so a method can mutate the object it is given but cannot make the caller's variable point
somewhere else.</p>`,
  notes:`
<h3>Constructors</h3>
<ul>
<li>Same name as the class, <b>no return type</b>, called automatically on creation.</li>
<li><b>Default</b> — supplied by the compiler only if you declare none. <b>Parameterised</b> — takes arguments. <b>Copy</b> — builds an object from another of the same class.</li>
<li>Constructors can be <b>overloaded</b>, never overridden, and are not inherited.</li>
<li>Execution order: base class constructor → derived class constructor. Destructors run in the <b>reverse</b> order.</li>
<li><b>Constructor chaining</b> — <code>this()</code> calls another constructor in the same class; <code>super()</code> calls the base one. Must be the first statement.</li>
</ul>
<h3>Shallow vs Deep copy</h3>
<div class="tbl"><table>
<tr><th></th><th>Shallow</th><th>Deep</th></tr>
<tr><td>Copies</td><td>Field values, including pointer/reference values</td><td>Fields and everything they point to</td></tr>
<tr><td>Result</td><td>Both objects share the referenced data</td><td>Fully independent objects</td></tr>
<tr><td>Risk</td><td>Change one and the other changes; <b>double free</b> in C++</td><td>Slower, more memory</td></tr>
</table></div>
<p>In C++ the compiler-generated copy constructor is <b>shallow</b> — which is exactly why a class holding a raw pointer must define its own (the <b>Rule of Three</b>: destructor, copy constructor, copy assignment).</p>
<h3>this and static</h3>
<ul>
<li><b><code>this</code></b> — a reference to the current object; disambiguates shadowed parameters and enables chaining.</li>
<li><b><code>static</code></b> member — belongs to the class, shared by all objects; a static method has <b>no <code>this</code></b> and cannot access instance members directly.</li>
<li><b>Destructor</b> — one per class, no parameters, cannot be overloaded; called automatically.</li>
</ul>`,
  mcqs:[
  {q:"A constructor differs from an ordinary method in that it",o:["Can be overridden","Has no return type","Must be static","Cannot take parameters"],a:1,
   w:"Constructors declare <b>no return type at all</b> (not even void), share the class name, and run automatically on creation."},
  {q:"In C++, the compiler-generated copy constructor performs a",o:["Deep copy","Shallow copy","No copy","Move"],a:1,
   w:"The implicit copy constructor copies members bitwise, so pointer members end up shared — a <b>shallow copy</b>."},
  {q:"When a derived class object is created, the order of constructor calls is",o:["Derived then base","Base then derived","Only derived","Only base"],a:1,
   w:"The <b>base</b> constructor runs first so the inherited part is ready before the derived constructor uses it. Destructors run in reverse."},
  {q:"A static method cannot",o:["Be overloaded","Access non-static instance members directly","Be called without an object","Return a value"],a:1,
   w:"A static method has no <code>this</code>, so there is no instance whose members it could access directly."},
  {q:"Two objects share the same underlying array after copying. This indicates",o:["A deep copy","A shallow copy","A move","A failed copy"],a:1,
   w:"A <b>shallow copy</b> duplicates the reference rather than the referenced data, so both objects see the same array."},
  {q:"Which cannot be overloaded?",o:["Constructor","Destructor","Method","Operator"],a:1,
   w:"A class has exactly one <b>destructor</b>, taking no parameters, so there is nothing to overload on."}]},

{ id:"op5", t:"SOLID and Design Principles", freq:2,
  lead:"Asked more at product companies. Knowing what each letter means is usually enough.",
  theory:`
<h2>What these principles are actually for</h2>
<p>Code that works is not the goal; code that can be changed six months later by someone else
is. SOLID is five rules that predict which changes will be cheap. Each one names a specific
kind of pain, and quoting the pain rather than the definition is what makes an answer sound
experienced.</p>

<h2>S — Single Responsibility Principle</h2>
<p><i>A class should have one reason to change.</i> Note the phrasing: not "do one thing", but
one <b>source of change</b> — usually one stakeholder or concern.</p>
<p>A <code>Report</code> class that computes totals, formats them as HTML and emails the
result has three: the accountants change the calculation, the designers change the formatting,
the ops team changes the mail server. Any of them can break the other two. Split into
<code>ReportCalculator</code>, <code>ReportFormatter</code>, <code>ReportSender</code>, and
each change touches one file. The signal that you are violating it is a class whose description
needs the word "and".</p>

<h2>O — Open/Closed Principle</h2>
<p><i>Open for extension, closed for modification.</i> Adding a feature should mean adding
code, not editing working code — because editing working code risks breaking what already
passes tests.</p>
<p>The smell is a growing <code>switch</code> or <code>if/else</code> chain over a type code:
every new payment method means editing the same method. Replace it with a
<code>PaymentMethod</code> interface and one class per method; adding UPI is a new file, and
the dispatch code never changes. Polymorphism is the mechanism that makes OCP achievable.</p>

<h2>L — Liskov Substitution Principle</h2>
<p><i>Objects of a subtype must be usable anywhere the supertype is expected, without the
caller knowing.</i> It is the constraint that makes inheritance safe, and the one most often
violated by textbook hierarchies.</p>
<div class="ex"><em>The classic violation</em>
<p><code>Square extends Rectangle</code>. Mathematically a square is a rectangle, so it looks
right. But Rectangle's contract includes "setting the width does not change the height", and
Square must break it to stay square. Any code doing
<code>r.setWidth(5); r.setHeight(4); assert r.area() == 20;</code> passes with a Rectangle and
fails with a Square.</p>
<p>The subclass did not add behaviour — it <b>weakened a guarantee</b>, and that is precisely
what LSP forbids. Other tells: an override that throws
<code>UnsupportedOperationException</code>, or one that tightens preconditions. The fix is
usually composition, or a common abstraction with no mutable shared contract.</p></div>
<p>Formally: a subtype may <b>weaken preconditions</b> (accept more) and <b>strengthen
postconditions</b> (promise more), never the reverse — which is also exactly why an override
may widen access and narrow exceptions but not the opposite.</p>

<h2>I — Interface Segregation Principle</h2>
<p><i>No client should be forced to depend on methods it does not use.</i> A fat
<code>Machine</code> interface with <code>print()</code>, <code>scan()</code> and
<code>fax()</code> forces a simple printer to implement two methods that throw. Split into
<code>Printer</code>, <code>Scanner</code>, <code>Fax</code> and let a multifunction device
implement all three. Small interfaces also mean a change to one does not force recompilation
and retesting of unrelated clients.</p>

<h2>D — Dependency Inversion Principle</h2>
<p><i>High-level modules should not depend on low-level modules; both should depend on
abstractions.</i> An <code>OrderService</code> that constructs a <code>MySQLDatabase</code>
directly is welded to MySQL and cannot be unit-tested without one. Have it depend on a
<code>Repository</code> interface and receive the implementation from outside — that is
<b>dependency injection</b>, the usual mechanism for DIP.</p>
<p>The "inversion" is in who owns the interface: it belongs to the <b>high-level</b> module,
which states what it needs, and the low-level module conforms. The arrow of dependency points
at the policy, not at the detail.</p>
<div class="say"><em>Say it like this</em>Depend on what a thing does, never on which thing it
is. Then you can substitute a fake in tests and a different vendor in production without the
business logic noticing.</div>

<h2>The shorter principles</h2>
<ul>
<li><b>DRY</b> — every piece of <i>knowledge</i> has one authoritative representation. The
caveat: two pieces of code that look alike but change for different reasons are not
duplication, and merging them creates coupling that is worse than the repetition.</li>
<li><b>KISS</b> — the simplest thing that works. Complexity must be justified by a real
requirement, not an imagined one.</li>
<li><b>YAGNI</b> — do not build for a future you are guessing at. Speculative generality is a
real maintenance cost paid for a benefit that usually never arrives.</li>
<li><b>Law of Demeter</b> — talk only to immediate collaborators.
<code>a.getB().getC().doThing()</code> couples you to three classes' internals; ask
<code>a</code> to do the thing instead.</li>
<li><b>Composition over inheritance</b> — covered under the pillars, and in practice the most
frequently useful of all of these.</li>
</ul>

<h2>Patterns worth naming</h2>
<p>Design patterns are recurring solutions, and a handful come up constantly:</p>
<div class="tbl"><table>
<tr><th>Pattern</th><th>Type</th><th>Problem it solves</th></tr>
<tr><td><b>Singleton</b></td><td>Creational</td><td>Exactly one instance, globally reachable. Private constructor plus a static accessor; needs care to be thread-safe (double-checked locking with a volatile field, or an enum). Widely criticised as hidden global state.</td></tr>
<tr><td><b>Factory</b></td><td>Creational</td><td>Create objects without the caller naming the concrete class — the usual way to apply OCP to construction.</td></tr>
<tr><td><b>Builder</b></td><td>Creational</td><td>Construct an object with many optional parameters, readably and immutably.</td></tr>
<tr><td><b>Observer</b></td><td>Behavioural</td><td>Notify many dependents when one object changes. Behind every event and listener system.</td></tr>
<tr><td><b>Strategy</b></td><td>Behavioural</td><td>Swap an algorithm at runtime — the canonical replacement for a switch over behaviour.</td></tr>
<tr><td><b>Decorator</b></td><td>Structural</td><td>Add behaviour to one object without subclassing. Java's stream classes are the standard example.</td></tr>
<tr><td><b>Adapter</b></td><td>Structural</td><td>Make an existing class fit an interface a client expects.</td></tr>
</table></div>`,
  notes:`
<h3>SOLID</h3>
<ul>
<li><b>S — Single Responsibility.</b> A class should have one reason to change. A class that formats a report <i>and</i> saves it to disk has two.</li>
<li><b>O — Open/Closed.</b> Open for extension, closed for modification. Add a new shape by adding a class, not by editing a <code>switch</code>.</li>
<li><b>L — Liskov Substitution.</b> A subclass must be usable wherever its base is, without surprising the caller. The classic violation: <code>Square extends Rectangle</code>, where setting the width silently changes the height.</li>
<li><b>I — Interface Segregation.</b> Many small interfaces beat one fat one. Do not force a class to implement methods it does not need.</li>
<li><b>D — Dependency Inversion.</b> Depend on abstractions, not concretions. High-level code should take an interface, not construct a concrete class.</li>
</ul>
<h3>Other principles worth naming</h3>
<ul>
<li><b>DRY</b> — Don't Repeat Yourself.</li>
<li><b>KISS</b> — Keep It Simple.</li>
<li><b>YAGNI</b> — You Aren't Gonna Need It.</li>
<li><b>Composition over inheritance</b> — prefer HAS-A to IS-A; inheritance couples you to the base class's implementation.</li>
</ul>
<h3>Design patterns most often asked</h3>
<div class="tbl"><table>
<tr><th>Pattern</th><th>Type</th><th>One line</th></tr>
<tr><td><b>Singleton</b></td><td>Creational</td><td>Exactly one instance, globally reachable</td></tr>
<tr><td><b>Factory</b></td><td>Creational</td><td>Create objects without naming the concrete class</td></tr>
<tr><td><b>Builder</b></td><td>Creational</td><td>Construct a complex object step by step</td></tr>
<tr><td><b>Observer</b></td><td>Behavioural</td><td>Notify dependents when state changes</td></tr>
<tr><td><b>Strategy</b></td><td>Behavioural</td><td>Swap an algorithm at run time</td></tr>
<tr><td><b>Adapter</b></td><td>Structural</td><td>Make an incompatible interface usable</td></tr>
<tr><td><b>Decorator</b></td><td>Structural</td><td>Add behaviour without subclassing</td></tr>
</table></div>`,
  mcqs:[

/* ================================================================= state */
const KEY="csc4:v1";
let S={sub:D[0].id, topic:D[0].topics[0].id, ans:{}, mock:null};
try{const r=localStorage.getItem(KEY); if(r) S={...S,...JSON.parse(r), mock:null};}catch(e){}
function save(){ try{localStorage.setItem(KEY,JSON.stringify({sub:S.sub,topic:S.topic,ans:S.ans}));}catch(e){} }

const subOf=id=>D.find(s=>s.id===id);
const topicsOf=id=>subOf(id).topics;
const topOf=(s,t)=>topicsOf(s).find(x=>x.id===t);
const qid=(t,i)=>t+":"+i;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function stats(){
  let done=0,right=0,total=0;
  for(const s of D) for(const t of s.topics){ total+=t.mcqs.length;
    t.mcqs.forEach((m,i)=>{const a=S.ans[qid(t.id,i)]; if(a!==undefined){done++; if(a===m.a)right++;}});}
  return {done,right,total};
}
function topicStat(t){
  let done=0,right=0;
  t.mcqs.forEach((m,i)=>{const a=S.ans[qid(t.id,i)]; if(a!==undefined){done++; if(a===m.a)right++;}});
  return {done,right,n:t.mcqs.length};
}

/* ================================================================ render */
function renderSubs(){
  const el=document.getElementById("subs");
  el.innerHTML=D.map(s=>{
    let n=0,d=0; s.topics.forEach(t=>{const st=topicStat(t); n+=st.n; d+=st.done;});
    return `<button class="sub" role="tab" data-sub="${s.id}" aria-selected="${s.id===S.sub}"
      style="--sc:var(${s.v})">${esc(s.name)}<em>${d}/${n}</em></button>`;
  }).join("");
  el.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{
    S.sub=b.dataset.sub; S.topic=topicsOf(S.sub)[0].id; S.mock=null; save(); renderAll();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

function renderRail(){
  const el=document.getElementById("rail"); const s=subOf(S.sub);
  el.innerHTML=s.topics.map(t=>{
    const st=topicStat(t); const full=st.done===st.n;
    return `<li><button data-t="${t.id}" aria-current="${t.id===S.topic&&!S.mock}"
      style="--sc:var(${s.v})"><span class="tick">${full?"✓":""}</span><span>${esc(t.t)}</span></button></li>`;
  }).join("")+`<li style="margin-top:10px"><button data-mock="1" aria-current="${!!S.mock}"
      style="--sc:var(${s.v})"><span class="tick"></span><span>Mixed test</span></button></li>`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    S.topic=b.dataset.t; S.mock=null; save(); renderAll();
    document.getElementById("main").scrollIntoView({behavior:"smooth",block:"start"});
  });
  el.querySelector("[data-mock]").onclick=()=>{ startMock(); };
}

function freqDots(n){
  return `<span class="freq">${[1,2,3].map(i=>`<b class="${i<=n?"on":""}"></b>`).join("")}
    ${n===3?"asked constantly":n===2?"asked often":"asked sometimes"}</span>`;
}

function qBlock(t,m,i,num){
  const key=qid(t.id,i), given=S.ans[key];
  const opts=m.o.map((o,j)=>{
    let cls="opt";
    if(given!==undefined){ if(j===m.a) cls+=" right"; else if(j===given) cls+=" wrong"; }
    return `<button class="${cls}" data-q="${key}" data-o="${j}" ${given!==undefined?"disabled":""}>
      <kbd>${"ABCD"[j]}</kbd><span>${o}</span></button>`;
  }).join("");
  return `<div class="q${given!==undefined?" done":""}">
    <div class="qtext"><span class="qnum">Q${num}</span><p>${m.q}</p></div>
    <div class="opts">${opts}</div>
    ${given!==undefined?`<div class="why"><b>${given===m.a?"Correct.":"Not quite."}</b> ${m.w}</div>`:""}
  </div>`;
}

function renderMain(){
  const main=document.getElementById("main"); const s=subOf(S.sub);
  if(S.mock){ renderMock(); return; }
  const t=topOf(S.sub,S.topic); const st=topicStat(t);
  main.style.setProperty("--sc",`var(${s.v})`);
  main.innerHTML=`
    <div class="thead">
      <div class="eyebrow"><span>${esc(s.short)}</span><span>·</span>${freqDots(t.freq)}</div>
      <h2>${esc(t.t)}</h2><p>${esc(t.lead)}</p>
    </div>
    ${t.theory?`<div class="jump"><a href="#sheet">Revision sheet</a><a href="#practice">Practice</a></div>`:""}
    <div class="notes">${t.theory?`${t.theory}<div class="sheet-rule" id="sheet"><span>Revision sheet</span></div>`:""}${t.notes}</div>
    <div class="qhead" id="practice"><h3>Practice</h3>
      <span class="tally">${st.done}/${st.n} answered${st.done?` · ${st.right} correct`:""}</span></div>
    ${t.mcqs.map((m,i)=>qBlock(t,m,i,i+1)).join("")}
    <div class="mock"><p><strong>Done with this topic?</strong> Move to the next in the list, or take a
      mixed test that pulls 20 questions at random from all four subjects.</p>
      <button class="btn" id="mockGo">Mixed test</button></div>`;
  main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>answer(b.dataset.q,+b.dataset.o));
  main.querySelector("#mockGo").onclick=startMock;
}

function startMock(){
  const pool=[];
  D.forEach(s=>s.topics.forEach(t=>t.mcqs.forEach((m,i)=>pool.push({s,t,m,i}))));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  S.mock=pool.slice(0,20); renderAll();
  document.getElementById("main").scrollIntoView({behavior:"smooth",block:"start"});
}

function renderMock(){
  const main=document.getElementById("main");
  main.style.setProperty("--sc","var(--accent)");
  let done=0,right=0;
  S.mock.forEach(x=>{const a=S.ans[qid(x.t.id,x.i)]; if(a!==undefined){done++; if(a===x.m.a)right++;}});
  main.innerHTML=`
    <div class="thead">
      <div class="eyebrow"><span>All subjects</span><span>·</span><span>20 questions</span></div>
      <h2>Mixed test</h2><p>Randomly drawn across OS, Computer Networks, DBMS and OOPs — the closest
      thing here to a real aptitude round.</p>
    </div>
    <div class="qhead"><h3>Questions</h3>
      <span class="tally">${done}/20 answered${done?` · ${right} correct`:""}</span></div>
    ${S.mock.map((x,n)=>`<div data-wrap><div class="eyebrow" style="--sc:var(${x.s.v});margin-bottom:5px">
       <span>${esc(x.s.short)} · ${esc(x.t.t)}</span></div>${qBlock(x.t,x.m,x.i,n+1)}</div>`).join("")}
    <div class="mock"><p><strong>${done===20?`Finished — ${right} out of 20.`:"Keep going."}</strong>
      Reshuffle for a fresh set, or go back to the topic notes.</p>
      <button class="btn" id="again">New mixed test</button>
      <button class="btn ghost" id="back">Back to topics</button></div>`;
  main.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>answer(b.dataset.q,+b.dataset.o));
  main.querySelector("#again").onclick=startMock;
  main.querySelector("#back").onclick=()=>{S.mock=null; renderAll();};
}

function answer(key,opt){
  if(S.ans[key]!==undefined) return;
  S.ans[key]=opt; save(); renderAll();
}

function renderScore(){
  const {done,right,total}=stats();
  document.getElementById("scoreTxt").textContent =
    done ? `${right}/${done} correct · ${total-done} left` : `0 / ${total} attempted`;
  document.getElementById("meterFill").style.width = (100*done/total).toFixed(1)+"%";
  document.documentElement.style.setProperty("--accent",`var(${subOf(S.sub).v})`);
}

function renderAll(){ renderSubs(); renderRail(); renderMain(); renderScore(); }

/* ------------------------------------------------------------- controls */
document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("Clear every answer and start again?")) return;
  S.ans={}; S.mock=null; save(); renderAll();
};
document.getElementById("themeBtn").onclick=()=>{
  const r=document.documentElement;
  const now=r.getAttribute("data-theme")
    || (window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  r.setAttribute("data-theme", now==="dark"?"light":"dark");
  try{localStorage.setItem(KEY+":theme", r.getAttribute("data-theme"));}catch(e){}
};
try{const th=localStorage.getItem(KEY+":theme"); if(th) document.documentElement.setAttribute("data-theme",th);}catch(e){}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey) return;
  const k=e.key.toUpperCase(); const idx="ABCD".indexOf(k);
  if(idx<0) return;
  const first=document.querySelector(".q:not(.done) [data-o='"+idx+"']");
  if(first){ first.click(); e.preventDefault(); }
});

renderAll();
</script>

</body>
</html>
