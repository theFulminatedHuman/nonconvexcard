<script>
/* ===================================================================== data
   Each topic: freq 1-3 = how often it shows up in placement rounds.
   notes = the sheet you revise from. mcqs = practice, answer + why.        */

const D = [
{ id:"os", name:"Operating Systems", short:"OS", v:"--os", topics:[

{ id:"os1", t:"Process, Thread and Context Switch", freq:3,
  lead:"The definitional opener in almost every OS round. Know the table cold.",
  theory:`
<h2>The problem the OS is solving</h2>
<p>A machine has a handful of CPU cores, one block of physical memory and a few devices. A
user has dozens of programs open. Somebody has to hand out the hardware, stop programs
reading each other's memory, and make each one behave as though it owns the machine. That
somebody is the operating system, and the three illusions it sells are: <b>every program has
its own CPU</b> (via scheduling), <b>its own memory</b> (via virtual memory), and <b>its own
devices</b> (via drivers and file descriptors).</p>
<p>A <b>process</b> is the unit that receives those illusions. It is not the program — the
program is a dead file on disk. The process is the program <i>plus</i> everything the OS
must remember to resume it: where it is in the code, what is in its registers, which memory
is its own, which files it has open.</p>

<h2>What a process is made of</h2>
<p>Its memory image is laid out in four regions, and knowing which is which answers a lot of
interview questions:</p>
<ol>
<li><b>Text</b> — the machine code. Read-only, so two copies of the same program can share
one physical copy.</li>
<li><b>Data</b> — global and static variables. Fixed size, known at compile time.</li>
<li><b>Heap</b> — memory from <code>malloc</code>/<code>new</code>. Grows upward, lifetime
controlled by the programmer.</li>
<li><b>Stack</b> — one frame per function call, holding parameters, return address and
locals. Grows downward toward the heap. Freed automatically when the call returns.</li>
</ol>
<p>Alongside that image the kernel keeps a <b>Process Control Block</b>: PID, current state,
saved program counter and registers, memory limits or page-table pointer, open-file table,
accounting and scheduling data. The PCB is the process as far as the kernel is concerned —
the memory image is just what the PCB points at.</p>

<h2>Why threads had to be invented</h2>
<p>Processes are isolated, which is exactly what you want for safety and exactly what you do
not want for a web server handling a thousand connections. Isolation means creating one is
expensive (a whole address space) and talking between two is expensive (data must cross an
address-space boundary through pipes, sockets or shared memory set up by the kernel).</p>
<p>A <b>thread</b> keeps the useful part and drops the expensive part. Threads of one process
share text, data, heap and open files; each keeps only its own <b>stack, registers and
program counter</b> — the three things that define <i>where in the code</i> it is. Creating
one is cheap, and two threads communicate by writing to the same variable, which costs
nothing.</p>
<p>The bill arrives later. Sharing a heap with no kernel between you means nothing stops two
threads writing the same variable at once, which is the entire subject of synchronization.
And because they share one address space, one thread that dereferences a null pointer takes
the whole process down — whereas one crashed process leaves its siblings untouched.</p>

<h2>How the switch actually happens</h2>
<p>A context switch is always triggered by entry to the kernel — a timer interrupt, a system
call, or a fault. The sequence is:</p>
<ol>
<li>The hardware traps into the kernel and saves a minimal register set.</li>
<li>The kernel saves the rest of the outgoing thread's registers into its PCB.</li>
<li>The scheduler picks the next thread to run.</li>
<li>The kernel restores that thread's registers from its PCB, and — if it belongs to a
<i>different process</i> — switches the page-table base register.</li>
<li>Return-from-trap drops back to user mode, now executing the new thread.</li>
</ol>
<p>Note step 4. Switching between threads of one process leaves the address space alone.
Switching between processes changes it, which invalidates the TLB (the cache of recent
address translations) and leaves the new process running on a CPU cache full of the old
one's data. That indirect cost — refilling TLB and cache — usually dwarfs the direct cost
of copying registers, and is the real reason thread switches are called cheap.</p>
<p>Either way the switch is <b>pure overhead</b>: during it, no user work is done. That is
the tension behind every scheduling decision — switch often and you respond quickly but
waste cycles; switch rarely and you waste none but make everyone wait.</p>

<h2>Where threads live: user space or the kernel</h2>
<div class="tbl"><table>
<tr><th>Model</th><th>Meaning</th><th>Consequence</th></tr>
<tr><td>Many-to-one</td><td>Many user threads, one kernel thread</td><td>Switching is very fast, but one blocking system call blocks every thread, and no true parallelism on multiple cores</td></tr>
<tr><td>One-to-one</td><td>Each user thread is a kernel thread</td><td>True parallelism and independent blocking; each thread costs a kernel resource. What Linux and Windows do</td></tr>
<tr><td>Many-to-many</td><td>m user threads onto n kernel threads</td><td>Best of both in theory, complex in practice; the idea returns in Go's goroutines and Java's virtual threads</td></tr>
</table></div>

<h2>Creating processes: fork and exec</h2>
<p>Unix splits creation into two calls, which is why the semantics look odd at first.
<code>fork()</code> duplicates the calling process — same code, same data, same open files —
and returns <b>twice</b>: <code>0</code> in the child, the child's PID in the parent. The two
then diverge on that return value. <code>exec()</code> replaces the current image with a new
program, keeping the PID and open files. A shell running a command does both: fork, then the
child execs.</p>
<div class="ex"><em>Worked example</em>
<p>A process calls <code>fork()</code> three times in a row with no <code>exec</code> and no
<code>exit</code>. After the first call there are 2 processes; each of those runs the second
call, giving 4; each of those runs the third, giving 8. Total processes = 2<sup>3</sup> = 8,
so <b>7 are children</b>. In general n consecutive forks create 2<sup>n</sup> − 1 children —
the trap is counting processes when the question asks for children.</p></div>
<p>Two states follow from parent and child being separate. If the child exits and the parent
has not yet called <code>wait()</code>, the kernel cannot discard the PCB — somebody still
needs to read the exit status — so it lingers as a <b>zombie</b>. If the parent exits first,
the child is re-parented to <code>init</code>/<code>systemd</code>, which reaps it; that is an
<b>orphan</b>. Zombies are a leak (PIDs are finite); orphans are handled automatically.</p>`,
  notes:`
<h3>Definitions</h3>
<ul>
<li><b>Program</b> — passive code on disk. <b>Process</b> — a program in execution, with its own address space.</li>
<li><b>Thread</b> — the smallest unit of CPU scheduling; lives inside a process and shares its address space.</li>
<li><b>PCB</b> (Process Control Block) — the OS's record per process: PID, state, program counter, CPU registers, memory limits, open files, scheduling info.</li>
</ul>
<h3>Process vs Thread</h3>
<div class="tbl"><table>
<tr><th></th><th>Process</th><th>Thread</th></tr>
<tr><td>Address space</td><td>Own, isolated</td><td>Shared with siblings</td></tr>
<tr><td>Shares</td><td>Nothing by default</td><td>Code, data, heap, files</td></tr>
<tr><td>Private to each</td><td>Everything</td><td>Stack, registers, PC, TID</td></tr>
<tr><td>Creation cost</td><td>Heavy</td><td>Light</td></tr>
<tr><td>Context switch</td><td>Slow (MMU/TLB flush)</td><td>Fast (no address-space change)</td></tr>
<tr><td>One crashes</td><td>Others survive</td><td>Whole process dies</td></tr>
<tr><td>Communication</td><td>IPC — pipes, shared memory, sockets</td><td>Shared variables (needs locks)</td></tr>
</table></div>
<h3>Process states</h3>
<p><code>new → ready → running → waiting → ready → … → terminated</code>. Only <b>running → waiting</b> is caused by the process itself (I/O or wait); <b>running → ready</b> is the scheduler preempting it.</p>
<h3>Context switch</h3>
<ul>
<li>Save the current PCB, load the next one. Pure overhead — no useful work happens during it.</li>
<li>Process switch also flushes the TLB and may thrash the cache; thread switch inside a process does not.</li>
</ul>
<h3>Special cases you will be asked</h3>
<ul>
<li><b>Zombie</b> — child finished, parent has not called <code>wait()</code>; the PCB entry lingers so the exit status can be read.</li>
<li><b>Orphan</b> — parent died first; adopted by <code>init</code>/<code>systemd</code>, which reaps it.</li>
<li><b>Fork</b> — returns <b>0 in the child</b>, the child's PID in the parent, −1 on failure. <code>n</code> consecutive forks create <b>2<sup>n</sup> − 1</b> child processes.</li>
</ul>
<div class="say"><em>Say it like this</em>Threads share the address space, which makes them cheap to switch and dangerous to share data between. Processes are isolated, which makes them safe and expensive.</div>`,
  mcqs:[
  {q:"Which of the following is NOT shared between threads of the same process?",o:["Code section","Global variables","Stack","Open file descriptors"],a:2,
   w:"Each thread gets its <b>own stack</b>, registers and program counter, because each has an independent call chain. Code, globals/heap and open files are shared."},
  {q:"A process executes <code>fork()</code> three times in sequence (no exec, no exit). How many child processes are created in total?",o:["3","7","8","6"],a:1,
   w:"Each fork doubles the number of processes: 1 → 2 → 4 → 8 total, of which <b>8 − 1 = 7</b> are children. The general formula is 2<sup>n</sup> − 1."},
  {q:"A zombie process is one that has",o:["Been swapped out to disk","Terminated but whose parent has not yet read its exit status","Lost its parent process","Exceeded its CPU time quantum"],a:1,
   w:"A <b>zombie</b> has finished executing but its PCB entry is retained so the parent can collect the exit status via <code>wait()</code>. A process that has <i>lost</i> its parent is an <b>orphan</b>."},
  {q:"Which transition is caused by the process itself rather than by the scheduler?",o:["Running → Ready","Ready → Running","Running → Waiting","Ready → Terminated"],a:2,
   w:"<b>Running → Waiting</b> happens when the process issues an I/O request or waits on an event. Running → Ready is preemption by the scheduler."},
  {q:"Switching between two threads of the same process is faster than switching between two processes mainly because",o:["Threads have smaller stacks","The address space and page tables do not change","Threads always have higher priority","Thread registers are not saved"],a:1,

  {q:"The PCB does NOT typically store",o:["Program counter and CPU registers","Process state","The complete source code of the program","List of open files"],a:2,

{ id:"os2", t:"CPU Scheduling", freq:3,
  lead:"Numericals are guaranteed. Learn the four algorithms and the three formulas.",
  theory:`
<h2>What the scheduler is choosing between</h2>
<p>Programs do not use the CPU continuously. They alternate: a <b>CPU burst</b> of
computation, then an <b>I/O burst</b> waiting for a disk or network. Measure real programs
and burst lengths follow a heavy exponential shape — very many short bursts, a few long ones.
That single fact drives every algorithm below: most of the time the right guess is that the
job in front of you is short.</p>
<p>Processes are therefore called <b>I/O-bound</b> (many short CPU bursts, mostly waiting) or
<b>CPU-bound</b> (few long ones). A good scheduler favours I/O-bound jobs, because letting
them issue their next I/O quickly keeps the devices busy while the CPU-bound job uses the
processor anyway.</p>

<h2>The metrics, and why they conflict</h2>
<div class="tbl"><table>
<tr><th>Metric</th><th>Definition</th><th>Who cares</th></tr>
<tr><td>Arrival time (AT)</td><td>When the process enters the ready queue</td><td>given</td></tr>
<tr><td>Burst time (BT)</td><td>CPU time it needs</td><td>given</td></tr>
<tr><td>Completion time (CT)</td><td>When it finishes</td><td>derived</td></tr>
<tr><td>Turnaround time</td><td>TAT = CT − AT</td><td>batch jobs</td></tr>
<tr><td>Waiting time</td><td>WT = TAT − BT</td><td>fairness</td></tr>
<tr><td>Response time</td><td>First run − AT</td><td>interactive users</td></tr>
<tr><td>Throughput</td><td>Processes finished per unit time</td><td>the system</td></tr>
</table></div>
<p>Turnaround and response pull in opposite directions. Finishing one job before starting the
next minimises average turnaround but makes the last arrival wait forever to be <i>seen</i>.
Slicing the CPU finely gives everyone a fast first response but stretches every completion
and spends real time on context switches. No algorithm wins both; each picks a side.</p>
<p><b>Preemptive</b> schedulers may take the CPU away from a running process (on a timer tick
or when a better candidate arrives); <b>non-preemptive</b> ones wait for it to block or
finish. Preemption is what makes a system feel responsive and what makes it need locks.</p>

<h2>The four algorithms</h2>
<h4>FCFS — first come, first served</h4>
<p>A plain FIFO queue, non-preemptive. Trivially fair in the sense that nobody jumps the
line, and terrible in practice because of the <b>convoy effect</b>: one long CPU-bound job at
the head makes every short I/O-bound job behind it wait, the devices go idle, and average
waiting time balloons. Average waiting time under FCFS depends on arrival order, which is a
tell that the algorithm is not optimising anything.</p>

<h4>SJF / SRTF — shortest job first</h4>
<p>Pick the smallest burst. This <b>provably minimises average waiting time</b>: if a longer
job ran before a shorter one, swapping them reduces the long job's completion by the short
job's length and increases the short one's by less, so any non-sorted order can be improved.
The preemptive version, <b>SRTF</b> (shortest remaining time first), re-decides whenever a
new process arrives.</p>
<p>The catch is that burst time is the future, and the OS cannot see it. Real systems
<i>predict</i> it from history with an exponential moving average,
<code>tau(n+1) = a*t(n) + (1-a)*tau(n)</code>, where <code>t(n)</code> is the last actual
burst and <code>a</code> is typically 0.5. The second catch: long jobs can be starved
indefinitely by a stream of short arrivals.</p>

<h4>Round robin</h4>
<p>FCFS plus a <b>time quantum</b>: run each process for at most q, then move it to the back
of the queue. With n processes nobody waits more than (n−1)q to run, so response time is
bounded — which is why RR is the basis of every interactive system. The quantum is the whole
design decision:</p>
<ul>
<li><b>q too large</b> → RR degenerates into FCFS, and response time collapses.</li>
<li><b>q too small</b> → context-switch overhead dominates; if a switch costs s, the fraction
of time wasted is s/(q+s).</li>
<li>Rule of thumb: pick q so that roughly <b>80% of CPU bursts finish inside one quantum</b>
— typically 10–100 ms against switch costs of a few microseconds.</li>
</ul>

<h4>Priority, and the problem with it</h4>
<p>Run the highest priority first (SJF is priority scheduling with priority = 1/burst). The
failure mode is <b>starvation</b>: a low-priority process may never run. The fix is
<b>aging</b> — raise a process's priority the longer it waits, so everything eventually
reaches the front.</p>

<h2>What real systems use</h2>
<p><b>Multilevel feedback queues.</b> Several queues at different priorities, each with its
own quantum. A new process enters at the top. If it uses its whole quantum it is assumed
CPU-bound and demoted to a longer-quantum, lower-priority queue; if it blocks for I/O first,
it stays high. Periodically everything is boosted back to the top to prevent starvation and
to catch programs that change behaviour. This approximates SJF <i>without knowing burst
times</i> — it learns them by watching — which is why it is the design behind real schedulers.</p>

<h2>Working a numerical</h2>
<div class="ex"><em>Worked example</em>
<p>Four processes — P1(AT 0, BT 7), P2(AT 2, BT 4), P3(AT 4, BT 1), P4(AT 5, BT 4).</p>
<p><b>FCFS:</b> order P1, P2, P3, P4 → completion 7, 11, 12, 16.<br>
TAT = 7, 9, 8, 11 → average <b>8.75</b>. WT = 0, 5, 7, 7 → average <b>4.75</b>.</p>
<p><b>SRTF:</b> P1 runs from 0; at t=2 P2 arrives needing 4 against P1's remaining 5, so P1 is
preempted; at t=4 P3 arrives needing 1 against P2's remaining 2, so P2 is preempted; P3
finishes at 5; P2 resumes and finishes at 7; P4 (remaining 4) beats P1 (remaining 5) and runs
to 11; P1 finishes at 16.<br>
Completion 16, 7, 5, 11 → TAT = 16, 5, 1, 6 → average <b>7</b>. WT = 9, 1, 0, 2 → average
<b>3</b>.</p>
<p>Same workload, average waiting time cut from 4.75 to 3 — and P1, the long job, paid for all
of it. That trade is the entire point.</p></div>
<p>Method, every time: build the Gantt chart first, read completion times off it, then
TAT = CT − AT, then WT = TAT − BT. Never try to compute waiting time directly.</p>`,
  notes:`
<h3>The three formulas</h3>
<ul>
<li><b>Completion time (CT)</b> — when the process finishes.</li>
<li><b>Turnaround time (TAT)</b> = CT − Arrival time</li>
<li><b>Waiting time (WT)</b> = TAT − Burst time</li>
<li><b>Response time</b> = first time on CPU − Arrival time</li>
</ul>
<h3>Algorithms</h3>
<div class="tbl"><table>
<tr><th>Algorithm</th><th>Preemptive?</th><th>Note</th></tr>
<tr><td>FCFS</td><td>No</td><td>Simple; suffers the <b>convoy effect</b> — one long job delays everyone</td></tr>
<tr><td>SJF</td><td>No</td><td><b>Optimal</b> average waiting time; needs burst length in advance; starves long jobs</td></tr>
<tr><td>SRTF</td><td>Yes</td><td>Preemptive SJF; optimal among preemptive; more context switches</td></tr>
<tr><td>Round Robin</td><td>Yes</td><td>Time quantum <i>q</i>; fair, best <b>response time</b>; no starvation</td></tr>
<tr><td>Priority</td><td>Either</td><td>Starvation risk → fix with <b>ageing</b></td></tr>
</table></div>
<h3>Round Robin quantum</h3>
<ul>
<li><i>q</i> too large → degenerates into <b>FCFS</b>.</li>
<li><i>q</i> too small → excessive context-switch overhead.</li>
<li>Rule of thumb: 80% of bursts should be shorter than <i>q</i>.</li>
</ul>
<h3>Other terms</h3>
<ul>
<li><b>Throughput</b> — processes completed per unit time. <b>CPU utilisation</b> — fraction of time the CPU is busy.</li>
<li><b>Dispatch latency</b> — time to stop one process and start the next.</li>
<li><b>Long-term scheduler</b> picks jobs into memory (degree of multiprogramming); <b>short-term</b> picks the next to run; <b>medium-term</b> does swapping.</li>
</ul>
<div class="say"><em>Worked example</em>P1(AT 0, BT 5), P2(AT 1, BT 3) under <b>SRTF</b>: at t=1, P2 has 3 &lt; P1's remaining 4, so P2 preempts and runs 1→4. P1 resumes 4→9. CT: P1=9, P2=4. TAT: 9, 3. WT: 4, 0. Average WT = 2.</div>`,
  mcqs:[
  {q:"Which scheduling algorithm gives the minimum average waiting time for a given set of processes arriving together?",o:["FCFS","Round Robin","Shortest Job First","Priority scheduling"],a:2,
   w:"<b>SJF is provably optimal</b> for average waiting time. Putting shorter jobs first reduces the total wait accumulated by everyone behind them."},
  {q:"Processes P1(burst 24), P2(burst 3), P3(burst 3) arrive at t=0 in that order under FCFS. The average waiting time is",o:["17","0","9","13"],a:0,
   w:"Waits are 0, 24, 27 → (0+24+27)/3 = <b>17</b>. Scheduling the short ones first (SJF) would give (0+3+6)/3 = 3 — the convoy effect in one number."},
  {q:"In Round Robin, if the time quantum becomes very large, the algorithm behaves like",o:["SJF","FCFS","SRTF","Priority scheduling"],a:1,
   w:"With a quantum longer than every burst, no process is ever preempted, so processes simply run to completion in arrival order — that is <b>FCFS</b>."},
  {q:"Starvation in priority scheduling is best solved by",o:["Increasing the time quantum","Ageing","Using a larger ready queue","Disabling preemption"],a:1,
   w:"<b>Ageing</b> gradually raises the priority of processes that have waited a long time, guaranteeing they eventually run."},
  {q:"Which of these is NOT a preemptive scheduling algorithm?",o:["Round Robin","SRTF","SJF","Preemptive priority"],a:2,
   w:"<b>SJF</b> is non-preemptive — once a process starts it runs to completion. Its preemptive version is SRTF (Shortest Remaining Time First)."},
  {q:"Turnaround time is defined as",o:["Completion time − Arrival time","Completion time − Burst time","Waiting time + Arrival time","Burst time − Waiting time"],a:0,
   w:"<b>TAT = CT − AT</b>: total time spent in the system. Waiting time is then TAT − Burst time."},
  {q:"The scheduler that controls the degree of multiprogramming is the",o:["Short-term scheduler","Long-term scheduler","Medium-term scheduler","Dispatcher"],a:1,
   w:"The <b>long-term (job) scheduler</b> decides which jobs are admitted into memory, which sets how many processes are resident — the degree of multiprogramming."}]},

{ id:"os3", t:"Deadlock", freq:3,
  lead:"The four conditions are a guaranteed question. Know them verbatim.",
  theory:`
<h2>How a deadlock forms</h2>
<p>Two threads, two locks. Thread A takes lock 1 and asks for lock 2. Thread B has already
taken lock 2 and asks for lock 1. Neither will release what it holds until it gets what it
wants, so neither ever proceeds. Nothing has crashed — both are perfectly healthy, waiting
patiently, forever.</p>
<p>Distinguish this from <b>starvation</b>, where a process <i>could</i> run but the scheduler
keeps choosing others: starvation is bad luck and may resolve, deadlock is a closed cycle and
never resolves. And from <b>livelock</b>, where processes keep changing state in response to
each other but make no progress — two people stepping aside in the same direction, repeatedly.</p>

<h2>The four conditions — all of them, simultaneously</h2>
<p>Coffman's conditions are necessary <i>together</i>. Break any one and deadlock becomes
impossible, which is exactly how prevention works:</p>
<div class="tbl"><table>
<tr><th>Condition</th><th>Meaning</th><th>Breaking it</th></tr>
<tr><td>Mutual exclusion</td><td>At least one resource is non-shareable</td><td>Make resources shareable — works for read-only files, impossible for a printer</td></tr>
<tr><td>Hold and wait</td><td>A process holding one resource requests another</td><td>Require all resources up front, or release everything before requesting more. Costs utilisation, risks starvation</td></tr>
<tr><td>No preemption</td><td>Resources cannot be forcibly taken</td><td>Take them back and restart later. Fine for CPU and memory, wrong for a half-written file or a lock</td></tr>
<tr><td>Circular wait</td><td>A cycle of processes each waiting on the next</td><td><b>Impose a global ordering</b> on resources and require requests in increasing order. The one practical technique</td></tr>
</table></div>
<p>That last row is the answer to give when asked how to prevent deadlock in real code:
number every lock, always acquire in increasing number. A cycle needs some process to request
a lower-numbered lock while holding a higher one, which the rule forbids.</p>

<h2>Seeing it: the resource-allocation graph</h2>
<p>Draw processes as circles, resource types as boxes with a dot per instance. An arrow from
process to resource is a request; from resource to process, an allocation. Then:</p>
<ul>
<li><b>One instance per resource type</b> — a cycle means deadlock, exactly.</li>
<li><b>Several instances per type</b> — a cycle is <i>necessary but not sufficient</i>. The
cycle may be broken when some process outside it releases a spare instance.</li>
</ul>
<p>The asymmetry is worth remembering: no cycle always means no deadlock; a cycle only
sometimes means deadlock.</p>

<h2>The four postures</h2>
<ol>
<li><b>Prevention</b> — structurally deny one Coffman condition. Safe, and costs utilisation.</li>
<li><b>Avoidance</b> — allow the conditions but refuse any request that could lead somewhere
bad. Needs advance knowledge of maximum demands. This is the Banker's algorithm.</li>
<li><b>Detection and recovery</b> — let deadlocks happen, run a cycle-detection pass
periodically, then recover by killing processes or preempting resources. Databases do this.</li>
<li><b>Ignore it</b> — the <b>ostrich algorithm</b>. What Linux and Windows do for most
resources, on the reasoning that deadlocks are rare and a reboot is cheaper than the
alternative. Be ready to say this: it is the honest answer about general-purpose OSes.</li>
</ol>

<h2>The Banker's algorithm</h2>
<p>Each process declares its <b>maximum</b> demand for each resource type in advance. The OS
tracks <b>Allocation</b> (held now) and computes <b>Need = Max − Allocation</b>. A state is
<b>safe</b> if there exists some ordering of all processes — a <i>safe sequence</i> — in
which each can get its remaining need from what is currently available plus what its
predecessors release on finishing.</p>
<p>When a request arrives, the OS pretends to grant it and runs the safety check. Grant only
if the resulting state is still safe. Note what this means: <b>unsafe is not deadlocked</b> —
it is merely a state from which deadlock <i>could</i> be reached, and the Banker refuses to
go there at all. That conservatism, plus the requirement to know maximum demands up front, is
why the algorithm is examined far more often than it is deployed.</p>
<div class="ex"><em>Worked example</em>
<p>Resources A=10, B=5, C=7. Five processes:</p>
<div class="tbl"><table>
<tr><th></th><th>Allocation</th><th>Max</th><th>Need = Max − Alloc</th></tr>
<tr><td>P0</td><td>0 1 0</td><td>7 5 3</td><td>7 4 3</td></tr>
<tr><td>P1</td><td>2 0 0</td><td>3 2 2</td><td>1 2 2</td></tr>
<tr><td>P2</td><td>3 0 2</td><td>9 0 2</td><td>6 0 0</td></tr>
<tr><td>P3</td><td>2 1 1</td><td>2 2 2</td><td>0 1 1</td></tr>
<tr><td>P4</td><td>0 0 2</td><td>4 3 3</td><td>4 3 1</td></tr>
</table></div>
<p>Total allocated is 7 2 5, so <b>Available = 3 3 2</b>. Now walk it:</p>
<ul>
<li>P0 needs 7 4 3 &gt; 3 3 2 — skip.</li>
<li>P1 needs 1 2 2 ≤ 3 3 2 — run it; on finishing it returns its allocation, Available becomes <b>5 3 2</b>.</li>
<li>P3 needs 0 1 1 ≤ 5 3 2 — run; Available becomes <b>7 4 3</b>.</li>
<li>P4 needs 4 3 1 ≤ 7 4 3 — run; Available becomes <b>7 4 5</b>.</li>
<li>P0 needs 7 4 3 ≤ 7 4 5 — run; Available becomes <b>7 5 5</b>.</li>
<li>P2 needs 6 0 0 ≤ 7 5 5 — run; Available becomes <b>10 5 7</b>.</li>
</ul>
<p>Every process completed, so the state is <b>safe</b> with sequence
&lt;P1, P3, P4, P0, P2&gt;. Safe sequences need not be unique — finding one is enough.</p></div>

<h2>Recovering once you are in one</h2>
<p>Either <b>abort</b> processes (all deadlocked ones, which is expensive but certain, or one
at a time re-running detection after each) or <b>preempt</b> resources and roll the victim
back. Both need a victim-selection policy — usually lowest priority, least work done so far,
fewest resources held — and both must avoid always picking the same victim, which turns
deadlock recovery into starvation.</p>`,
  notes:`
<h3>Four necessary conditions (all must hold)</h3>
<ul>
<li><b>Mutual exclusion</b> — at least one resource is non-sharable.</li>
<li><b>Hold and wait</b> — a process holds one resource while requesting another.</li>
<li><b>No preemption</b> — resources cannot be forcibly taken away.</li>
<li><b>Circular wait</b> — a cycle of processes each waiting on the next.</li>
</ul>
<p>Break <b>any one</b> and deadlock is impossible. This is <i>deadlock prevention</i>.</p>
<h3>Four handling strategies</h3>
<div class="tbl"><table>
<tr><th>Strategy</th><th>Idea</th></tr>
<tr><td><b>Prevention</b></td><td>Structurally deny one of the four conditions (e.g. order all resources and require increasing order → no circular wait)</td></tr>
<tr><td><b>Avoidance</b></td><td>Grant only if the system stays in a <b>safe state</b> — Banker's algorithm; needs maximum needs declared up front</td></tr>
<tr><td><b>Detection + recovery</b></td><td>Let it happen, run a wait-for-graph cycle check, then kill or roll back a victim</td></tr>
<tr><td><b>Ostrich algorithm</b></td><td>Ignore it — what Linux and Windows largely do</td></tr>
</table></div>
<h3>Safe state</h3>
<p>A state is <b>safe</b> if there exists some ordering of processes in which each can obtain its maximum need and finish. Every safe state is deadlock-free; an unsafe state <i>may</i> deadlock but need not.</p>
<h3>Related terms</h3>
<ul>
<li><b>Starvation</b> — a process waits indefinitely but the system still makes progress. Deadlock ⇒ no progress at all.</li>
<li><b>Livelock</b> — processes keep changing state in response to each other but do no useful work.</li>
<li>With a single instance per resource type, a <b>cycle in the resource-allocation graph ⇒ deadlock</b>. With multiple instances, a cycle is necessary but not sufficient.</li>
</ul>
<div class="say"><em>Exam trick</em>Minimum resources to avoid deadlock: with <i>n</i> processes each needing a maximum of <i>m</i> units of a resource, deadlock is impossible if there are at least <b>n(m − 1) + 1</b> units.</div>`,
  mcqs:[
  {q:"Which is NOT one of the four necessary conditions for deadlock?",o:["Mutual exclusion","Hold and wait","Circular wait","Priority inversion"],a:3,
   w:"The four are mutual exclusion, hold and wait, no preemption and circular wait. <b>Priority inversion</b> is a separate scheduling problem."},
  {q:"The Banker's algorithm is used for deadlock",o:["Prevention","Avoidance","Detection","Recovery"],a:1,
   w:"Banker's is <b>avoidance</b>: it grants a request only if the resulting state is safe. Prevention denies a condition structurally; detection finds deadlocks after the fact."},
  {q:"A system is in an unsafe state. This means",o:["The system is deadlocked","The system will definitely deadlock","The system may deadlock","The system cannot allocate any more resources"],a:2,
   w:"Unsafe means no safe sequence is guaranteed, so deadlock <b>may</b> occur — it is not certain. Safe ⇒ no deadlock; unsafe ⇏ deadlock."},
  {q:"Three processes each need a maximum of 2 units of the same resource. The minimum number of units that guarantees no deadlock is",o:["3","4","5","6"],a:1,
   w:"Using n(m − 1) + 1 = 3(2 − 1) + 1 = <b>4</b>. With 3 units each process could hold 1 and wait forever; a 4th lets one process finish and release."},
  {q:"Requiring every process to request all its resources before starting eliminates which condition?",o:["Mutual exclusion","Hold and wait","No preemption","Circular wait"],a:1,
   w:"If all resources are acquired at once, a process never holds one while waiting for another — <b>hold and wait</b> is broken."},
  {q:"In a resource-allocation graph with exactly one instance of every resource type, a cycle implies",o:["Deadlock definitely exists","Deadlock may exist","Starvation","Nothing"],a:0,
   w:"With <b>single instances</b>, a cycle is both necessary and sufficient for deadlock. With multiple instances it is necessary but not sufficient."}]},

{ id:"os4", t:"Memory Management and Paging", freq:3,
  lead:"Paging, fragmentation and address translation — numericals appear constantly.",
  theory:`
<h2>Three problems memory management must solve</h2>
<p><b>Relocation.</b> A compiler does not know where in RAM the program will be loaded, and
the answer changes between runs. Addresses in the binary must therefore be translated at
some point into real ones.</p>
<p><b>Protection.</b> A bug in one process must not be able to read or corrupt another's
memory — nor the kernel's. Since the check happens on every single memory reference, it must
be done in hardware.</p>
<p><b>Sharing and capacity.</b> Two copies of the same program should share one copy of the
code, and the total memory demanded by all running programs may exceed physical RAM.</p>
<p>All three are answered by the same move: programs use <b>logical (virtual) addresses</b>,
and the <b>MMU</b> translates each to a <b>physical address</b> on the fly. The program never
sees a real address.</p>

<h2>The first attempt: contiguous allocation</h2>
<p>Give each process one contiguous block, with a <b>base</b> register added to every address
and a <b>limit</b> register checked against it. Simple and fast. The problem is what happens
after processes come and go: free memory ends up as scattered small gaps, and a request for
a large block fails even though the total free space is ample. That is <b>external
fragmentation</b>.</p>
<p>Placement policies mitigate but do not fix it — <b>first fit</b> (the first hole big
enough; fast and, in practice, as good as any), <b>best fit</b> (the smallest adequate hole;
leaves useless slivers), <b>worst fit</b> (the largest hole; generally the poorest). The real
fix, <b>compaction</b>, means moving live processes together, which needs dynamic relocation
and stops everything while it runs.</p>

<h2>Paging: stop insisting on contiguity</h2>
<p>Split physical memory into fixed-size <b>frames</b> and the logical address space into
<b>pages</b> of the same size (typically 4 KB). Any page may sit in any frame. A per-process
<b>page table</b> records which frame holds each page.</p>
<p>This eliminates external fragmentation outright — every hole is exactly one frame, so every
hole is usable. The cost is <b>internal fragmentation</b>: the last page of a process is
rarely full, wasting on average half a page per process. That is a bounded, small, predictable
cost, which is why paging won.</p>
<h4>The address split</h4>
<p>A logical address is cut into <b>page number p</b> (index into the page table) and
<b>offset d</b> (position within the page). The offset passes through translation untouched —
only the page number is replaced by a frame number. So:</p>
<ul>
<li>Page size 2<sup>n</sup> bytes → the low <b>n bits</b> are the offset.</li>
<li>Logical address space 2<sup>m</sup> bytes → the high <b>m − n bits</b> are the page number,
giving 2<sup>m−n</sup> pages.</li>
</ul>
<div class="ex"><em>Worked example</em>
<p>32-bit addresses, 4 KB pages. 4 KB = 2<sup>12</sup>, so the offset is <b>12 bits</b> and the
page number is 32 − 12 = <b>20 bits</b> — 2<sup>20</sup> = about a million pages. At 4 bytes
per page-table entry that is a <b>4 MB page table per process</b>, which must itself live in
memory. With a hundred processes that is 400 MB of page tables — clearly unworkable, which is
the motivation for everything below.</p></div>

<h2>Making page tables affordable</h2>
<ul>
<li><b>Multi-level paging.</b> Page the page table. Split the 20-bit page number into 10 + 10:
an outer table of 1024 entries points at inner tables of 1024 entries each. Only the inner
tables that are actually used need to exist, so a process touching a little memory needs a few
kilobytes of tables instead of 4 MB. 64-bit machines extend this to four levels.</li>
<li><b>Inverted page table.</b> One global table with an entry per <i>physical frame</i>
rather than per virtual page, so its size is fixed by RAM rather than by the number of
processes. Saves enormous space, but now a lookup means searching by process-and-page rather
than indexing — solved with a hash table, and it makes shared memory awkward.</li>
</ul>

<h2>The TLB, and why translation is not slow</h2>
<p>Naively, every memory reference now needs two accesses: one to read the page table, one to
read the data. That halves memory speed. The fix is a small fully-associative cache of recent
translations inside the MMU — the <b>Translation Lookaside Buffer</b>. It works for the same
reason caches always work: locality. A program touching a few pages repeatedly hits the TLB
almost every time, and hit ratios of 98–99% are normal.</p>
<p><b>Effective access time</b> with TLB lookup time t, memory access time m and hit ratio h:</p>
<p><code>EAT = h*(t + m) + (1 - h)*(t + 2m)</code></p>
<div class="ex"><em>Worked example</em>
<p>TLB 20 ns, memory 100 ns, hit ratio 80%:<br>
hit path = 20 + 100 = 120 ns, miss path = 20 + 100 + 100 = 220 ns.<br>
EAT = 0.8(120) + 0.2(220) = 96 + 44 = <b>140 ns</b> against 100 ns with no paging at all — a
40% slowdown. Raise the hit ratio to 98% and EAT falls to 0.98(120) + 0.02(220) = <b>122 ns</b>.
The whole viability of paging rests on that hit ratio.</p></div>
<p>Because a TLB entry is meaningless in another address space, a process context switch must
<b>flush the TLB</b> (or tag entries with an address-space ID). That flush, and the misses
that follow it, are a large part of why process switches cost more than thread switches.</p>

<h2>Segmentation, and what it was for</h2>
<p>Paging divides memory by a number the programmer never chose. <b>Segmentation</b> divides
it the way the programmer thinks — a segment for code, one for the stack, one for each large
data structure — each of variable length, addressed as (segment, offset) with its own base
and limit. That makes protection and sharing natural: mark the code segment read-only and
share it, let the stack segment grow.</p>
<p>But variable-length segments bring back external fragmentation, which is why pure
segmentation lost. Modern x86 keeps a vestigial segmentation layer above paging and uses
paging for everything that matters.</p>
<div class="tbl"><table>
<tr><th></th><th>Paging</th><th>Segmentation</th></tr>
<tr><td>Block size</td><td>Fixed</td><td>Variable</td></tr>
<tr><td>Divided by</td><td>The hardware</td><td>The programmer's logical units</td></tr>
<tr><td>Fragmentation</td><td>Internal only</td><td>External</td></tr>
<tr><td>Address</td><td>Single linear address, split by hardware</td><td>Two-part: segment + offset</td></tr>
<tr><td>Table entry</td><td>Frame number</td><td>Base + limit</td></tr>
</table></div>`,
  notes:`
<h3>Paging</h3>
<ul>
<li>Logical memory is split into fixed-size <b>pages</b>; physical memory into <b>frames</b> of the same size.</li>
<li>The <b>page table</b> maps page number → frame number, one per process.</li>
<li>Logical address = <code>(page number, offset)</code>. If page size = 2<sup>k</sup>, the low <b>k bits</b> are the offset.</li>
<li><b>TLB</b> — a small associative cache of recent page-table entries. On a hit, one memory access; on a miss, two (table, then data).</li>
</ul>
<h3>Effective access time</h3>
<p><code>EAT = h·(T<sub>TLB</sub> + T<sub>mem</sub>) + (1 − h)·(T<sub>TLB</sub> + 2·T<sub>mem</sub>)</code> where <i>h</i> is the TLB hit ratio.</p>
<h3>Fragmentation</h3>
<div class="tbl"><table>
<tr><th></th><th>Internal</th><th>External</th></tr>
<tr><td>What</td><td>Unused space <i>inside</i> an allocated block</td><td>Free space scattered in small unusable holes</td></tr>
<tr><td>Caused by</td><td>Fixed-size allocation → <b>paging</b></td><td>Variable-size allocation → <b>segmentation</b></td></tr>
<tr><td>Fix</td><td>Smaller pages</td><td>Compaction, or paging</td></tr>
</table></div>
<h3>Paging vs Segmentation</h3>
<ul>
<li><b>Paging</b> — fixed size, invisible to the programmer, no external fragmentation.</li>
<li><b>Segmentation</b> — variable size, matches logical units (code, stack, heap), causes external fragmentation.</li>
</ul>
<h3>Contiguous allocation strategies</h3>
<ul>
<li><b>First fit</b> — first hole big enough. Fastest.</li>
<li><b>Best fit</b> — smallest adequate hole. Leaves tiny useless holes.</li>
<li><b>Worst fit</b> — largest hole. Generally the worst performer.</li>
</ul>`,
  mcqs:[
  {q:"Paging suffers from",o:["External fragmentation only","Internal fragmentation only","Both","Neither"],a:1,
   w:"Fixed-size pages mean the last page of a process is partly unused — <b>internal fragmentation</b>. Since all frames are the same size, no external fragmentation occurs."},
  {q:"A system uses 4 KB pages and 32-bit logical addresses. How many bits are used for the offset?",o:["10","12","16","20"],a:1,
   w:"4 KB = 2<sup>12</sup> bytes, so <b>12 bits</b> address a byte within a page; the remaining 20 bits are the page number."},
  {q:"The TLB is best described as",o:["A cache for frequently used data","A cache for page-table entries","A table of free frames","Part of secondary storage"],a:1,
   w:"The <b>Translation Lookaside Buffer</b> caches recent page-number → frame-number translations so address translation avoids a page-table memory access."},
  {q:"Which allocation strategy tends to leave many small unusable holes?",o:["First fit","Best fit","Worst fit","Next fit"],a:1,
   w:"<b>Best fit</b> picks the smallest adequate hole, so the leftover sliver is tiny and usually too small to reuse."},
  {q:"Segmentation differs from paging chiefly in that segments are",o:["Always smaller","Of variable size and correspond to logical units","Stored only on disk","Never swapped out"],a:1,
   w:"Segments are <b>variable-sized</b> and mirror the program's logical divisions — code, data, stack — whereas pages are fixed-size and arbitrary."},
  {q:"With a TLB hit ratio of 80%, TLB access 20 ns and memory access 100 ns, the effective access time is",o:["120 ns","140 ns","100 ns","200 ns"],a:1,
   w:"0.8(20 + 100) + 0.2(20 + 200) = 96 + 44 = <b>140 ns</b>. A miss costs two memory accesses: one for the page table, one for the data."}]},

{ id:"os5", t:"Virtual Memory and Page Replacement", freq:3,
  lead:"Page-fault counting numericals and Belady's anomaly are near-certain.",
  theory:`
<h2>The idea: a process need not be entirely in memory</h2>
<p>At any moment a program is executing one small region of its code and touching one small
region of its data. Error-handling paths, rarely used features, oversized arrays — most of a
process is dead weight most of the time. <b>Virtual memory</b> exploits that: keep only the
pages actually in use in RAM, leave the rest on disk, and fetch them when touched.</p>
<p>The consequences are larger than they first appear:</p>
<ul>
<li>A process can be <b>bigger than physical memory</b>.</li>
<li><b>More processes fit</b> at once, so CPU utilisation and throughput rise.</li>
<li>Starting a program is fast — you need not load it all before it can run.</li>
<li><code>fork()</code> becomes cheap via <b>copy-on-write</b>: parent and child share every
page read-only, and only a page that one of them writes is actually duplicated.</li>
</ul>

<h2>Demand paging and the page fault</h2>
<p>Each page-table entry carries a <b>valid/invalid bit</b>. Invalid means either "not a legal
address" or "legal, but currently on disk". A reference to the second kind traps into the
kernel as a <b>page fault</b>, and the handler:</p>
<ol>
<li>Checks the reference is legal; if not, kill the process (this is a segmentation fault).</li>
<li>Finds a free frame — or runs <b>page replacement</b> to make one.</li>
<li>Schedules a disk read of the page into that frame, and blocks the process meanwhile.</li>
<li>Updates the page table, sets the valid bit.</li>
<li><b>Restarts the faulting instruction</b>, which now succeeds.</li>
</ol>
<p>Step 5 is the subtle one: the instruction is re-executed from the beginning, so the
hardware must be able to undo any partial effects — a real constraint on instruction-set
design.</p>

<h2>Why the fault rate must be tiny</h2>
<p>Memory is measured in nanoseconds, disk in milliseconds — a factor of roughly 100,000. With
page-fault probability p, memory access ma and fault service time f:</p>
<p><code>EAT = (1 - p)*ma + p*f</code></p>
<div class="ex"><em>Worked example</em>
<p>ma = 200 ns, f = 8 ms = 8,000,000 ns. Then
EAT ≈ 200 + p(7,999,800) ns.<br>
At p = 1/1000 that is 200 + 8000 = <b>8200 ns</b> — a <b>40× slowdown</b> from one fault per
thousand accesses.<br>
To keep the slowdown under 10% you need 200 + 7,999,800p &lt; 220, i.e.
p &lt; 2.5 × 10<sup>−6</sup> — <b>fewer than one fault per 400,000 accesses</b>.</p></div>
<p>That number is the reason page-replacement policy matters so much: the goal is not to be
clever, it is to make faults vanishingly rare.</p>

<h2>Page replacement algorithms</h2>
<h4>FIFO</h4>
<p>Evict the page that has been resident longest. Trivial to implement and indifferent to
whether the page is in heavy use — the oldest page may be the hottest one. It also suffers
<b>Belady's anomaly</b>: giving it <i>more</i> frames can cause <i>more</i> faults.</p>
<div class="ex"><em>Worked example — Belady's anomaly</em>
<p>Reference string 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5.</p>
<p><b>Three frames:</b> faults on 1, 2, 3, 4, 1, 2, 5, then hits on 1 and 2, then faults on 3,
4, then a hit on 5 → <b>9 faults</b>.</p>
<p><b>Four frames:</b> faults on 1, 2, 3, 4, hits on 1 and 2, then faults on 5, 1, 2, 3, 4, 5
→ <b>10 faults</b>. More memory, worse performance.</p></div>

<h4>Optimal (OPT / MIN)</h4>
<p>Evict the page that will not be used for the longest time in the future. Provably minimal
fault count, and impossible to implement since it needs the future. Its value is as a
<b>benchmark</b>: measure a real algorithm against OPT on the same reference string to see how
much room is left.</p>

<h4>LRU</h4>
<p>Evict the page unused for the longest time — OPT with the reference string read backwards,
justified by locality. It is free of Belady's anomaly (it is a <b>stack algorithm</b>: the
pages held with n frames are always a subset of those held with n+1). The problem is cost:
exact LRU needs a timestamp written on <i>every</i> memory reference, or a linked list
reordered on every reference. Nobody does this in hardware.</p>

<h4>The approximations actually used</h4>
<ul>
<li><b>Reference bit.</b> The hardware sets a bit when a page is touched. The OS clears them
periodically; a page with a clear bit has not been used lately.</li>
<li><b>Second chance / clock.</b> Sweep frames in a circle. If the candidate's reference bit
is 0, evict it; if 1, clear the bit and move on. A page therefore survives only if it was
touched since the hand last passed. This is FIFO that skips recently used pages, and it is
what real systems use.</li>
<li><b>Enhanced second chance</b> adds the <b>dirty bit</b> and prefers to evict
(not-referenced, not-modified) pages, since a clean page needs no write-back to disk — the
eviction is free.</li>
</ul>

<h2>Thrashing</h2>
<p>Raise the degree of multiprogramming and CPU utilisation rises — until each process has too
few frames to hold the pages it is actively using. Then every process faults constantly, all
of them sit blocked on the disk, CPU utilisation collapses, and a scheduler watching CPU
utilisation responds by <b>admitting more processes</b>, which makes it worse. The system
spends all its time paging and none computing. That feedback loop is <b>thrashing</b>, and the
curve of CPU utilisation against multiprogramming degree falling off a cliff is the classic
picture.</p>
<p>The cure is to give each process the frames it actually needs:</p>
<ul>
<li><b>Working-set model.</b> The working set W(t, delta) is the set of distinct pages
referenced in the last delta references — an estimate of current locality. Sum the working-set
sizes; if the total exceeds available frames, suspend a process. Choosing delta is the
difficulty: too small misses the locality, too large spans several.</li>
<li><b>Page-fault frequency.</b> Skip the estimation and control the symptom: measure each
process's fault rate, give frames to one above the upper bound, take frames from one below
the lower bound, suspend a process if nothing can be spared.</li>
</ul>
<p>Also note the allocation policy question: with <b>local replacement</b> a process may only
evict its own pages, so one badly behaved process cannot hurt others but cannot borrow idle
frames either; with <b>global replacement</b> it may take any frame, which gives better
throughput and makes each process's performance depend on everyone else's behaviour.</p>`,
  notes:`
<h3>Virtual memory</h3>
<ul>
<li>Lets a process run with only part of it in RAM; the rest lives on disk (swap). Enables programs larger than physical memory.</li>
<li><b>Demand paging</b> — a page is loaded only when referenced. A reference to a non-resident page raises a <b>page fault</b>.</li>
<li><b>Page fault service</b>: trap → find the page on disk → find a free frame (or evict one) → load → update page table → restart the instruction.</li>
</ul>
<h3>Replacement algorithms</h3>
<div class="tbl"><table>
<tr><th>Algorithm</th><th>Evicts</th><th>Belady's anomaly?</th></tr>
<tr><td>FIFO</td><td>Oldest loaded page</td><td><b>Yes</b></td></tr>
<tr><td>Optimal (OPT)</td><td>The page used furthest in the future</td><td>No</td></tr>
<tr><td>LRU</td><td>Least recently used</td><td>No</td></tr>
<tr><td>Clock / Second chance</td><td>FIFO but skips pages with reference bit 1</td><td>Yes</td></tr>
</table></div>
<h3>Belady's anomaly</h3>
<p>More frames producing <b>more</b> page faults. Occurs in FIFO; impossible for <b>stack algorithms</b> (LRU, OPT), where the pages held with <i>n</i> frames are always a subset of those held with <i>n</i>+1.</p>
<h3>Thrashing</h3>
<ul>
<li>The system spends more time paging than executing. CPU utilisation collapses.</li>
<li>Cause: degree of multiprogramming too high, so each process holds fewer frames than its <b>working set</b>.</li>
<li>Fix: <b>working set model</b> or <b>page-fault frequency</b> control; in the worst case, swap a process out.</li>
</ul>
<div class="say"><em>Exam trick</em>Counting faults: the first reference to each distinct page is always a fault (a <b>compulsory</b> miss). With 3 frames and reference string 1,2,3,4,1,2,5,1,2,3,4,5 — FIFO gives 9 faults, LRU gives 10, OPT gives 7.</div>`,
  mcqs:[
  {q:"Belady's anomaly can occur in",o:["LRU","Optimal","FIFO","All of these"],a:2,
   w:"<b>FIFO</b> is not a stack algorithm, so increasing the frame count can increase faults. LRU and OPT are stack algorithms and are immune."},
  {q:"Thrashing occurs when",o:["The CPU is idle waiting for I/O","Processes spend more time paging than executing","The page table is too large","Too many processes are terminated"],a:1,
   w:"<b>Thrashing</b> is the collapse that follows from each process holding fewer frames than its working set, so almost every reference faults."},
  {q:"Reference string 1,2,3,4,1,2,5 with 3 frames under FIFO gives how many page faults?",o:["5","6","7","4"],a:2,
   w:"1,2,3 fault (3). 4 evicts 1 (4). 1 evicts 2 (5). 2 evicts 3 (6). 5 evicts 4 (7). Total <b>7</b>."},
  {q:"The Optimal page replacement algorithm is not used in practice because",o:["It causes Belady's anomaly","It requires knowledge of future references","It is too slow to compute","It needs too much memory"],a:1,
   w:"OPT evicts the page referenced <b>furthest in the future</b>, which is unknowable at run time. It is used as a lower bound to judge real algorithms."},
  {q:"On a page fault, the instruction that caused it is",o:["Skipped","Restarted after the page is loaded","Executed with a null value","Aborted and the process killed"],a:1,
   w:"The faulting instruction is <b>restarted</b> once the page is resident, so the process sees no difference apart from the delay."},
  {q:"The working set of a process is",o:["All pages allocated to it","The set of pages it referenced in the most recent time window","Its page table","The pages currently in the TLB"],a:1,
   w:"The <b>working set</b> is the set of pages referenced in the last Δ references — an estimate of the locality the process currently needs resident."}]},

{ id:"os6", t:"Synchronization and the Critical Section", freq:3,
  lead:"Semaphore vs mutex, and the three requirements, are asked almost every time.",
  theory:`
<h2>Where the bug comes from</h2>
<p>Take the statement <code>count++</code>. The CPU cannot do that in one step; it becomes
load count into a register, add one, store back. Now run two threads over the same
<code>count</code>, starting at 5. Both load 5, both compute 6, both store 6. Two increments
happened and the counter went up by one.</p>
<p>Nothing is wrong with either thread. The bug lives in the <b>interleaving</b>, and the
interleaving depends on when the scheduler preempts — so the program is correct on most runs
and wrong occasionally, under load, in production. That is a <b>race condition</b>, and the
section of code that must not be interleaved is the <b>critical section</b>.</p>

<h2>What a correct solution must guarantee</h2>
<ol>
<li><b>Mutual exclusion</b> — at most one thread inside the critical section at a time.</li>
<li><b>Progress</b> — if no thread is inside and some want in, only the contenders decide who
enters, and the decision cannot be postponed indefinitely. (In other words: an idle thread
must not block an eager one.)</li>
<li><b>Bounded waiting</b> — there is a limit on how many times others can enter ahead of a
thread that is already waiting. This is what rules out starvation.</li>
</ol>
<p>Many plausible solutions satisfy the first and fail the second or third — that is precisely
what the classic examples are for.</p>

<h2>Building the lock</h2>
<h4>In software: Peterson's solution</h4>
<p>Two threads share <code>flag[2]</code> (I want in) and <code>turn</code> (whose go it is).
Each sets its flag, sets <code>turn</code> to the <i>other</i> thread, then waits while the
other wants in and it is the other's turn. Because each defers to the other, whichever writes
<code>turn</code> last loses, so exactly one proceeds. It satisfies all three requirements and
needs no special hardware.</p>
<p>It also does not work on modern hardware without memory barriers, because processors and
compilers reorder those writes. Know it as the proof that mutual exclusion is achievable in
software alone, not as something to use.</p>

<h4>In hardware: an atomic instruction</h4>
<p>The real fix is an instruction that reads and writes in one uninterruptible step:</p>
<ul>
<li><b>test-and-set</b> — set a word to true and return its old value. Spin until you are the
one who saw false.</li>
<li><b>compare-and-swap (CAS)</b> — write a new value only if the current one matches an
expected one; return what was there. Strictly more powerful, and the primitive behind every
lock-free data structure.</li>
</ul>
<p>A lock built by spinning on these is a <b>spinlock</b>. It burns CPU while waiting, which is
right when the wait is shorter than a context switch (a few instructions inside a kernel, on
another core) and badly wrong when the wait is long — on a single core it is catastrophic,
since the spinning thread prevents the holder from ever running.</p>

<h2>Mutex, semaphore, monitor</h2>
<p><b>Mutex</b> — a binary lock with <b>ownership</b>: the thread that locks it is the one that
must unlock it. That ownership is what allows priority inheritance and deadlock detection, and
it is the difference interviewers are asking about.</p>
<p><b>Semaphore</b> — an integer with two atomic operations, <code>wait()</code> (decrement;
block while the value is zero) and <code>signal()</code> (increment; wake a waiter). It has
<b>no owner</b> — any thread may signal one that another waited on, which is what makes it a
signalling device rather than just a lock. A <b>counting</b> semaphore initialised to N
permits N concurrent holders (N identical resources); a <b>binary</b> semaphore initialised to
1 resembles a mutex but lacks ownership.</p>
<p><b>Monitor</b> — a language construct bundling data with procedures where only one thread
may be active at a time, plus <b>condition variables</b> offering <code>wait</code> and
<code>signal</code> for waiting on a state rather than a count. Because the compiler enforces
the mutual exclusion, monitors are far harder to misuse — Java's <code>synchronized</code> is
one.</p>

<h2>The classic problems, and the point of each</h2>
<h4>Producer–consumer (bounded buffer)</h4>
<p>Three semaphores: <code>empty</code> initialised to N, <code>full</code> initialised to 0,
and <code>mutex</code> at 1. The producer waits on <code>empty</code>, then on
<code>mutex</code>, inserts, signals <code>mutex</code>, signals <code>full</code>. The
consumer mirrors it.</p>
<div class="ex"><em>Why the order matters</em>
<p>Swap the producer's first two waits — take <code>mutex</code> before <code>empty</code> —
and the buffer eventually fills. The producer now holds the mutex while blocked on
<code>empty</code>; the consumer cannot get the mutex to remove anything; nothing ever frees a
slot. <b>Deadlock from reordering two lines.</b> The rule the example teaches: acquire the
counting semaphore before the mutex, and release in the reverse order.</p></div>

<h4>Readers–writers</h4>
<p>Many readers may share the data; a writer needs it alone. The naive solution lets a
continuous stream of readers starve every writer; a writer-preferring solution starves the
readers. There is no policy that is fair to both without extra machinery — the lesson is that
"correct" and "fair" are separate properties.</p>

<h4>Dining philosophers</h4>
<p>Five philosophers, five forks, each needs both neighbours' forks. Everyone picking up the
left fork first deadlocks instantly — a textbook circular wait. Fixes map one-to-one onto the
Coffman conditions: allow only four at the table (breaks hold-and-wait), pick up both forks
atomically or not at all, or have odd-numbered philosophers take the right fork first
(<b>breaks circular wait</b> by imposing an ordering).</p>

<h2>Priority inversion</h2>
<p>A low-priority thread holds a lock. A high-priority thread needs it and blocks. A
medium-priority thread — needing no lock at all — preempts the low-priority one, which
therefore never finishes and never releases. The high-priority thread is now effectively
blocked by a medium-priority one that it outranks.</p>
<p>The fix is <b>priority inheritance</b>: while a high-priority thread waits on a lock, the
holder temporarily inherits that priority, runs, and releases. This is not academic — it is
what caused the Mars Pathfinder rover to reset repeatedly in 1997, and the fix uploaded to
Mars was to enable priority inheritance.</p>`,
  notes:`
<h3>Critical section problem</h3>
<p>A solution must satisfy all three:</p>
<ul>
<li><b>Mutual exclusion</b> — at most one process inside the critical section.</li>
<li><b>Progress</b> — if no one is inside, the choice of who enters cannot be postponed indefinitely.</li>
<li><b>Bounded waiting</b> — a limit on how many times others may enter before a waiting process does.</li>
</ul>
<h3>Semaphore vs Mutex</h3>
<div class="tbl"><table>
<tr><th></th><th>Mutex</th><th>Semaphore</th></tr>
<tr><td>Value</td><td>Locked / unlocked</td><td>Integer counter</td></tr>
<tr><td>Purpose</td><td>Mutual exclusion</td><td>Signalling / counting resources</td></tr>
<tr><td>Ownership</td><td>Owned — only the locker may unlock</td><td>Not owned — any thread may signal</td></tr>
<tr><td>Types</td><td>One</td><td>Binary and counting</td></tr>
</table></div>
<h3>Semaphore operations</h3>
<p><code>wait(S)</code> / <code>P(S)</code>: <code>S--</code>; if <code>S &lt; 0</code>, block. <code>signal(S)</code> / <code>V(S)</code>: <code>S++</code>; if <code>S ≤ 0</code>, wake one. Both must be <b>atomic</b>.</p>
<h3>Classic problems</h3>
<ul>
<li><b>Producer–consumer</b> — <code>mutex</code> = 1, <code>empty</code> = n, <code>full</code> = 0. Producer: <code>wait(empty), wait(mutex) … signal(mutex), signal(full)</code>. Reversing the two waits deadlocks.</li>
<li><b>Readers–writers</b> — many readers or one writer.</li>
<li><b>Dining philosophers</b> — five forks; breaking symmetry (one philosopher picks left first) avoids deadlock.</li>
</ul>
<h3>Other terms</h3>
<ul>
<li><b>Race condition</b> — outcome depends on the interleaving of threads.</li>
<li><b>Busy waiting / spinlock</b> — loops while waiting; wastes CPU but avoids a context switch, so it is right only for very short critical sections.</li>
<li><b>Monitor</b> — a language construct bundling shared data with synchronised procedures; easier to get right than raw semaphores.</li>
</ul>`,
  mcqs:[
  {q:"Which is NOT a requirement of a correct critical-section solution?",o:["Mutual exclusion","Progress","Bounded waiting","Priority inversion"],a:3,
   w:"The three requirements are mutual exclusion, progress and bounded waiting. <b>Priority inversion</b> is a problem, not a requirement."},
  {q:"The key difference between a binary semaphore and a mutex is that",o:["A mutex can take any integer value","A mutex has ownership — only the locking thread can unlock it","A binary semaphore cannot block","They are identical"],a:1,
   w:"A <b>mutex is owned</b> by the thread that locked it and only that thread may release it. A semaphore has no owner, so any thread may signal it."},
  {q:"In the producer–consumer solution, a producer executes wait(mutex) before wait(empty). This can cause",o:["Starvation only","Deadlock","A race condition","Nothing — the order is irrelevant"],a:1,
   w:"If the buffer is full, the producer holds <code>mutex</code> and blocks on <code>empty</code>. The consumer cannot acquire <code>mutex</code> to make space — <b>deadlock</b>."},
  {q:"A spinlock is preferable to a blocking lock when",o:["The critical section is very long","The expected wait is shorter than a context switch","There is only one CPU","Memory is scarce"],a:1,
   w:"Spinning burns CPU but avoids two context switches, so it wins only when the <b>expected wait is very short</b>."},
  {q:"The semaphore operation wait(S) is required to be atomic so that",o:["It runs faster","Two processes cannot decrement S simultaneously and both proceed","It can be preempted safely","The value of S stays positive"],a:1,
   w:"Without atomicity, two processes could both read S = 1, both decrement, and both enter the critical section — the very race the semaphore exists to prevent."},
  {q:"A race condition occurs when",o:["Two processes have equal priority","The result depends on the relative timing of thread execution","A process waits indefinitely","The CPU is over-utilised"],a:1,
   w:"A <b>race condition</b> is any situation where the outcome depends on the interleaving of concurrent accesses to shared data."}]}
]},
