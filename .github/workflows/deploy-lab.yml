# Builds the AI Mathematics Research Lab (lab/) and publishes the static export
# to GitHub Pages.
#
# This workflow is manual on purpose. The repository's Pages site is currently
# served from the Jekyll site at the repository root; running this workflow —
# and switching Settings → Pages → Source to "GitHub Actions" — replaces that
# site with this application. To deploy on every push instead, add:
#
#   push:
#     branches: [main]
#     paths: ['lab/**', '.github/workflows/deploy-lab.yml']
#
# under `on:` below.
name: Deploy lab to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; cancel a queued one rather than a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab/package-lock.json

      # A project page is served from https://<owner>.github.io/<repo>/, so the
      # export needs that prefix. A user or organisation page (repository named
      # <owner>.github.io) is served from the root and needs no prefix.
      - name: Resolve base path
        id: base
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm test

      # `next build` type-checks the project with the same tsconfig
      # (`typescript.ignoreBuildErrors` is false), and it regenerates the
      # `next-env.d.ts` that a standalone `tsc` run would need, so the build is
      # both the compile step and the type check.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lab/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
